name: Finalize Bento v32 American clean release

on:
  push:
    branches: [bento-v32-american]

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bento-v32-american

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm clean production ancestry
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Current main is not an ancestor'; exit 1; }
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('data/library_manifest.json','utf8'));
          const expected={recipeCount:2181,standardRecipeCount:1710,japaneseRecipeCount:252,filipinoRecipeCount:248,appRelease:'31.3'};
          for(const [k,v] of Object.entries(expected)) if(m[k]!==v) throw new Error(`Unexpected production baseline ${k}: ${m[k]}`);
          if(m.qualityAuditSnapshot?.fullLibrary?.uniqueRecipeIds!==2181) throw new Error('Production unique-ID baseline mismatch');
          NODE

      - name: American content checkpoint
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const {execFileSync}=require('child_process');
          const {TextDecoder,TextEncoder}=require('util');
          const modules=fs.readdirSync('data').filter(n=>/^american-recipes-\d{3}-\d{3}\.js$/.test(n)).sort((a,b)=>Number(a.match(/-(\d{3})-/)[1])-Number(b.match(/-(\d{3})-/)[1]));
          if(modules.length!==32)throw new Error(`Expected 32 American modules, got ${modules.length}`);
          for(const f of ['data/american-runtime.js','data/recipe-quality-runtime.js',...modules.map(n=>`data/${n}`)])execFileSync(process.execPath,['--check',f]);
          const g={BENTO_RECIPE_LIBRARY:[],BENTO_RECIPE_PHOTO_INDEX:{},console,TextDecoder,TextEncoder,Buffer,URL,Map,Set,Date,Math,JSON,Array,Object,String,Number,Boolean,RegExp,setTimeout,clearTimeout};g.window=g;g.self=g;
          const c=vm.createContext(g),run=f=>vm.runInContext(fs.readFileSync(f,'utf8'),c,{filename:f,timeout:10000});
          run('data/american-runtime.js');for(const n of modules)run(`data/${n}`);run('data/recipe-quality-runtime.js');
          const rows=c.BENTO_RECIPE_LIBRARY;
          if(rows.length!==243)throw new Error(`American count ${rows.length}`);
          if(new Set(rows.map(r=>r.id)).size!==243)throw new Error('American duplicate IDs');
          if(new Set(rows.map(r=>String(r.title).trim().toLowerCase())).size!==243)throw new Error('American duplicate titles');
          const ingredients=new Map(),methods=new Map();
          for(let i=0;i<rows.length;i++){
            const r=rows[i],id=`us_${String(i+1).padStart(3,'0')}`;
            if(r.id!==id)throw new Error(`American ID sequence ${r.id} != ${id}`);
            if(r.cuisine!=='American'||r.recipeType!=='Reviewed classic')throw new Error(`${r.id} identity`);
            if(!Array.isArray(r.ingredients)||r.ingredients.length<2)throw new Error(`${r.id} ingredients`);
            if(!Array.isArray(r.steps)||r.steps.length<4)throw new Error(`${r.id} steps`);
            if(!Number.isFinite(r.prep)||!Number.isFinite(r.cook)||!Number.isFinite(r.total)||r.total<r.prep+r.cook)throw new Error(`${r.id} time`);
            if(!Array.isArray(r.sourceUrls)||!r.sourceUrls.length||!r.sourceUrls.every(u=>/^https:\/\//.test(u)))throw new Error(`${r.id} sources`);
            if(!Array.isArray(r.photoQueries)||r.photoQueries.length<2)throw new Error(`${r.id} photo queries`);
            const ib=r.ingredients.map(String).join('\n').toLowerCase(),mb=r.steps.map(String).join('\n').toLowerCase();
            if(ingredients.has(ib))throw new Error(`Duplicate ingredient body ${ingredients.get(ib)} / ${r.id}`);ingredients.set(ib,r.id);
            if(methods.has(mb))throw new Error(`Duplicate method body ${methods.get(mb)} / ${r.id}`);methods.set(mb,r.id);
            const norm=a=>[...new Set((a||[]).map(String).map(x=>x.toLowerCase()))].sort().join('|');
            if(norm(c.BENTO_INFER_ALLERGENS(r.ingredients))!==norm(r.allergens))throw new Error(`${r.id} allergen mismatch`);
          }
          const stepRange=[Math.min(...rows.map(r=>r.steps.length)),Math.max(...rows.map(r=>r.steps.length))];
          if(stepRange[0]!==5||stepRange[1]!==10)throw new Error(`Unexpected American step range ${stepRange}`);
          console.log(JSON.stringify({american:rows.length,modules:modules.length,stepRange},null,2));
          NODE

      - name: Integrate v32 PWA and manifest
        run: |
          node <<'NODE'
          const fs=require('fs');
          const RELEASE='32.0',ASSET='32p1',AMERICAN=243,TOTAL=2424,STANDARD=1953;
          const modules=fs.readdirSync('data').filter(n=>/^american-recipes-\d{3}-\d{3}\.js$/.test(n)).sort((a,b)=>Number(a.match(/-(\d{3})-/)[1])-Number(b.match(/-(\d{3})-/)[1]));
          const tags=[`  <script src="data/american-runtime.js?v=${ASSET}" defer></script>`,...modules.map(n=>`  <script src="data/${n}?v=${ASSET}" defer></script>`)].join('\n');
          let index=fs.readFileSync('index.html','utf8');
          if(/data\/american-runtime\.js\?v=/.test(index))throw new Error('American runtime unexpectedly already integrated');
          const qtag=/  <script src="data\/recipe-quality-runtime\.js\?v=[^"]+" defer><\/script>/;
          if(!qtag.test(index))throw new Error('Quality runtime index anchor missing');
          index=index.replace(qtag,`${tags}\n  <script src="data/recipe-quality-runtime.js?v=${ASSET}" defer></script>`);
          fs.writeFileSync('index.html',index);

          let sw=fs.readFileSync('service-worker.js','utf8');
          sw=sw.replace(/^const CACHE=.*$/m,`const CACHE='bento-shell-v1.0.0-v${ASSET}';`);
          sw=sw.replace(/^const ASSET_VERSIONS=new Set\(\[([^\]]*)\]\);$/m,(_m,inside)=>{
            const vals=[...inside.matchAll(/'([^']+)'/g)].map(x=>x[1]);if(!vals.includes(ASSET))vals.push(ASSET);
            return `const ASSET_VERSIONS=new Set([${vals.map(v=>`'${v}'`).join(',')}]);`;
          });
          if(/\.\/data\/american-runtime\.js\?v=/.test(sw))throw new Error('American runtime unexpectedly already cached');
          const qasset=/  '\.\/data\/recipe-quality-runtime\.js\?v=[^']+',/;
          if(!qasset.test(sw))throw new Error('Quality runtime SW anchor missing');
          const assets=[`  './data/american-runtime.js?v=${ASSET}',`,...modules.map(n=>`  './data/${n}?v=${ASSET}',`)].join('\n');
          sw=sw.replace(qasset,`${assets}\n  './data/recipe-quality-runtime.js?v=${ASSET}',`);
          fs.writeFileSync('service-worker.js',sw);

          const p='data/library_manifest.json',m=JSON.parse(fs.readFileSync(p,'utf8'));
          m.libraryVersion=39;m.recipeCount=TOTAL;m.newRecipesThisBuild=AMERICAN;m.cuisineCount=11;
          m.verifiedCuisineLibraries=[...(m.verifiedCuisineLibraries||[]).filter(x=>x!=='American'),'American'];
          m.standardRecipeCount=STANDARD;m.japaneseRecipeCount=252;m.filipinoRecipeCount=248;m.americanRecipeCount=AMERICAN;
          m.dishImageCount=TOTAL;m.instructionVersion=39;m.detailedInstructionRecipeCount=TOTAL;m.appRelease=RELEASE;m.generatedAt=new Date().toISOString();
          m.cacheFix=`v32.0 adds the ${AMERICAN}-recipe American coverage-first regional library under the ${ASSET} shell generation while preserving Japanese v31.2 and Filipino v31.3 depth releases.`;
          m.qualityGate='Permanent Bento recipe standard plus completed Indian, Italian, French, Spanish, Japanese, Filipino and American coverage gates: authentic dish identity, measured ingredients, coherent time math, equipment, stored and inferred critical-allergen coverage, authoritative references, photo routing, doneness cues, semantic consistency, safety adaptations where warranted, and variable-length methods without artificial recipe-count or step targets.';
          m.allergenPolicy='Allergen metadata is merged with ingredient-based inference for soy, gluten, egg, milk, fish, shellfish, nuts, sesame, coconut and mustard. Plant milks and nut butters remain excluded from false dairy detection; milk-fed meat is not dairy. v32 adds narrow recognition for tartar sauce while protecting vegan/egg-free variants, plus walleye, halibut, catfish, crawfish, pecans, buns and oyster crackers.';
          m.qualityAuditSnapshot ||= {};
          m.qualityAuditSnapshot.fullLibrary={recipeCount:TOTAL,uniqueRecipeIds:TOTAL,criticalStructureFailures:0,releaseGate:'pass'};
          m.qualityAuditSnapshot.standardCuisines ||= {};
          Object.assign(m.qualityAuditSnapshot.standardCuisines,{recipeCount:STANDARD,Japanese:252,Filipino:248,American:243,flaggedRecipes:0,allergenFailures:0,referenceFailures:0,equipmentFailures:0,photoMetadataFailures:0,hierarchy:'Japanese 252 > Filipino 248 > American 243 > Spanish 215 > French 175 > Korean 174 > Indian 171 > Italian 165 > Vietnamese 130 > Chinese 90 = Thai 90'});
          m.qualityAuditSnapshot.methodDepth ||= {};m.qualityAuditSnapshot.methodDepth.AmericanStepRange='5-10';
          m.qualityAuditSnapshot.PWA ||= {};m.qualityAuditSnapshot.PWA.assetVersion=ASSET;m.qualityAuditSnapshot.PWA.recipeQualityRuntime=40;
          m.qualityAuditSnapshot.v32American={auditedAt:new Date().toISOString().slice(0,10),AmericanTotal:243,firstId:'us_001',lastId:'us_243',productionBase:'0ab4e84aa523120bc750e9b567001c561437c7e2',productionBaseTotal:2181,productionBaseStandard:1710,JapanesePreserved:252,FilipinoPreserved:248,coveragePolicy:'Coverage determines recipe count; 243 is the completed reviewed American pass, not a target or cap.',regionalCoverage:['New England','New York / Pennsylvania / Mid-Atlantic / Chesapeake','Appalachia / Lowcountry / Southern coastal / Deep South','Louisiana Cajun / Creole / New Orleans','Black American regional foodways','Carolinas / Memphis / Alabama / Kentucky / Tennessee barbecue and regional traditions','Texas barbecue / Tejano / Tex-Mex / Texas Czech traditions','Midwest / Great Lakes / Upper Midwest / Plains','Southwest / New Mexico / Mountain West','California / Pacific Northwest','Alaska','Traditional Native Hawaiian','Hawaiʻi local / plantation-era multicultural','Nation/community-specific Cherokee, Choctaw, Chickasaw, Ojibwe, Potawatomi, Diné and Kanien’kehá:ka foodways'],allergenFailures:0,structureFailures:0,sourceFailures:0,photoMetadataFailures:0,runtimeRegression:'passed',status:'passed'};
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          NODE

      - name: Full-library runtime and PWA regression
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const {execFileSync}=require('child_process');const {TextDecoder,TextEncoder}=require('util');
          const index=fs.readFileSync('index.html','utf8'),sw=fs.readFileSync('service-worker.js','utf8'),manifest=JSON.parse(fs.readFileSync('data/library_manifest.json','utf8'));
          const scripts=[...index.matchAll(/<script\s+src="([^"]+)"[^>]*><\/script>/g)].map(m=>m[1].split('?')[0]).filter(s=>s.endsWith('.js'));
          const dataScripts=scripts.filter(s=>s.startsWith('data/'));
          for(const f of dataScripts){if(!fs.existsSync(f))throw new Error(`Missing index script ${f}`);execFileSync(process.execPath,['--check',f]);}
          const el=()=>({classList:{add(){},remove(){},toggle(){},contains(){return false}},style:{},dataset:{},appendChild(){},setAttribute(){},removeAttribute(){},addEventListener(){},querySelector(){return null},querySelectorAll(){return[]}});
          const doc={readyState:'loading',body:el(),documentElement:el(),addEventListener(){},removeEventListener(){},querySelector(){return null},querySelectorAll(){return[]},getElementById(){return null},createElement(){return el()}};
          const storage={getItem(){return null},setItem(){},removeItem(){},clear(){}};
          const g={console,TextDecoder,TextEncoder,Buffer,URL,URLSearchParams,Map,Set,Date,Math,JSON,Array,Object,String,Number,Boolean,RegExp,Promise,Intl,document:doc,localStorage:storage,sessionStorage:storage,navigator:{userAgent:'qa',serviceWorker:{addEventListener(){}}},location:{href:'http://localhost/',origin:'http://localhost',pathname:'/'},matchMedia(){return{matches:false,addEventListener(){},removeEventListener(){}}},requestAnimationFrame:f=>0,cancelAnimationFrame(){},setTimeout(){return 0},clearTimeout(){},setInterval(){return 0},clearInterval(){},fetch:async()=>({ok:false,json:async()=>({}),text:async()=>''}),crypto:{randomUUID:()=>`qa-${Math.random()}`},Event:function(){}};g.window=g;g.self=g;g.globalThis=g;
          const c=vm.createContext(g);
          for(const f of dataScripts)vm.runInContext(fs.readFileSync(f,'utf8'),c,{filename:f,timeout:20000});
          const rows=Array.isArray(c.BENTO_RECIPE_LIBRARY)?c.BENTO_RECIPE_LIBRARY:[];
          if(rows.length!==2424)throw new Error(`Runtime total ${rows.length}`);
          if(new Set(rows.map(r=>r.id)).size!==2424)throw new Error('Runtime duplicate IDs');
          const counts={};for(const r of rows){const k=r.cuisine||'(none)';counts[k]=(counts[k]||0)+1;}
          const expected={Japanese:252,Filipino:248,Korean:174,Chinese:90,Thai:90,Vietnamese:130,Indian:171,Italian:165,French:175,Spanish:215,American:243,Teyvat:372,'(none)':99};
          for(const [k,v] of Object.entries(expected))if(counts[k]!==v)throw new Error(`${k} count ${counts[k]} != ${v}`);
          const standard=new Set(['Japanese','Filipino','Korean','Chinese','Thai','Vietnamese','Indian','Italian','French','Spanish','American']);
          if(rows.filter(r=>standard.has(r.cuisine)).length!==1953)throw new Error('Standard cuisine runtime count mismatch');
          const us=rows.filter(r=>r.cuisine==='American');if(us.length!==243||us[0].id!=='us_001'||us.at(-1).id!=='us_243')throw new Error('American runtime sequence mismatch');
          if((index.match(/data\/american-runtime\.js\?v=32p1/g)||[]).length!==1)throw new Error('American runtime index multiplicity');
          for(const n of fs.readdirSync('data').filter(n=>/^american-recipes-\d{3}-\d{3}\.js$/.test(n))){if((index.match(new RegExp(`data/${n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\?v=32p1`,'g'))||[]).length!==1)throw new Error(`Index integration ${n}`);if(!sw.includes(`'./data/${n}?v=32p1'`))throw new Error(`SW missing ${n}`);}
          for(const s of ['data/japanese-extra-244-252.js?v=31j2','data/filipino-extra-241-248.js?v=31f1','data/recipe-quality-runtime.js?v=32p1'])if(!index.includes(s))throw new Error(`Index missing ${s}`);
          for(const s of ["'./data/japanese-extra-244-252.js?v=31j2'","'./data/filipino-extra-241-248.js?v=31f1'","'./data/recipe-quality-runtime.js?v=32p1'"])if(!sw.includes(s))throw new Error(`SW missing ${s}`);
          if(!sw.includes("const CACHE='bento-shell-v1.0.0-v32p1';"))throw new Error('SW cache generation mismatch');
          if(!sw.includes("'32p1'"))throw new Error('SW asset version missing');
          const me={recipeCount:2424,standardRecipeCount:1953,japaneseRecipeCount:252,filipinoRecipeCount:248,americanRecipeCount:243,libraryVersion:39,instructionVersion:39,detailedInstructionRecipeCount:2424,dishImageCount:2424,appRelease:'32.0'};
          for(const [k,v] of Object.entries(me))if(manifest[k]!==v)throw new Error(`Manifest ${k} ${manifest[k]} != ${v}`);
          if(manifest.qualityAuditSnapshot?.fullLibrary?.uniqueRecipeIds!==2424||manifest.qualityAuditSnapshot?.PWA?.assetVersion!=='32p1'||manifest.qualityAuditSnapshot?.PWA?.recipeQualityRuntime!==40)throw new Error('Manifest QA snapshot mismatch');
          console.log(JSON.stringify({total:rows.length,unique:new Set(rows.map(r=>r.id)).size,standard:1953,American:counts.American,Japanese:counts.Japanese,Filipino:counts.Filipino},null,2));
          NODE

      - name: Remove temporary workflow and verify final diff
        run: |
          rm -f .github/workflows/finalize-v32-american-clean.yml
          git add -- index.html service-worker.js data/library_manifest.json
          git add -u -- .github/workflows/finalize-v32-american-clean.yml
          git diff --cached --check
          git diff --name-status origin/main > /tmp/final-diff.txt
          cat /tmp/final-diff.txt
          node <<'NODE'
          const fs=require('fs');
          const lines=fs.readFileSync('/tmp/final-diff.txt','utf8').trim().split(/\r?\n/).filter(Boolean);
          const allowed=p=>p==='data/american-runtime.js'||/^data\/american-recipes-\d{3}-\d{3}\.js$/.test(p)||['data/library_manifest.json','data/recipe-quality-runtime.js','index.html','service-worker.js'].includes(p);
          for(const line of lines){const [status,...rest]=line.split('\t'),p=rest.at(-1);if(status.startsWith('D'))throw new Error(`Unexpected deletion: ${line}`);if(!allowed(p))throw new Error(`Unexpected final diff: ${line}`);}
          const files=lines.map(x=>x.split('\t').at(-1));
          if(files.filter(x=>/^data\/american-recipes-/.test(x)).length!==32)throw new Error('Final diff American module count');
          for(const p of ['data/american-runtime.js','data/library_manifest.json','data/recipe-quality-runtime.js','index.html','service-worker.js'])if(!files.includes(p))throw new Error(`Final diff missing ${p}`);
          if(files.length!==37)throw new Error(`Expected final 37-file diff, got ${files.length}`);
          console.log('Final diff gate PASS:',files.length,'files');
          NODE

      - name: Commit verified release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize Bento v32 American cuisine release"
          git push origin HEAD:bento-v32-american
