name: Bento JP PH expansion build
on:
  push:
    paths:
      - '.github/workflows/jp-ph-expansion-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire v25 expansion
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html'); s=p.read_text()
          s=s.replace('?v=24p2','?v=25p1')
          marker='<script src="data/recipes-data.js?v=25p1" defer></script>'
          insert='''<script src="data/recipes-data.js?v=25p1" defer></script>\n  <script src="data/japanese-extra-150-169.js?v=25p1" defer></script>\n  <script src="data/japanese-extra-171-189.js?v=25p1" defer></script>\n  <script src="data/filipino-extra-165-184.js?v=25p1" defer></script>'''
          if 'japanese-extra-150-169.js' not in s: s=s.replace(marker,insert)
          p.write_text(s)
          p=Path('service-worker.js'); s=p.read_text().replace('24p2','25p1')
          marker="  './data/recipes-data.js?v=25p1',"
          insert="""  './data/recipes-data.js?v=25p1',\n  './data/japanese-extra-150-169.js?v=25p1',\n  './data/japanese-extra-171-189.js?v=25p1',\n  './data/filipino-extra-165-184.js?v=25p1',"""
          if 'japanese-extra-150-169.js' not in s: s=s.replace(marker,insert)
          s=s.replace("const CACHE='bento-shell-v1.0.0-v25p1-qa1';","const CACHE='bento-shell-v1.0.0-v25p1';")
          p.write_text(s)
          p=Path('app.js'); s=p.read_text(); s=s.replace('const VERSION = 24;','const VERSION = 25;'); p.write_text(s)
          m=json.loads(Path('data/library_manifest.json').read_text())
          m.update({'libraryVersion':29,'recipeCount':1118,'newRecipesThisBuild':60,'standardRecipeCount':647,'japaneseRecipeCount':189,'filipinoRecipeCount':184,'koreanRecipeCount':174,'chineseRecipeCount':40,'thaiRecipeCount':60,'dishImageCount':1118,'instructionVersion':29,'detailedInstructionRecipeCount':1118,'appRelease':'25.0','generatedAt':'2026-08-14T13:25:00+08:00'})
          m['qualityGate']='Full production QA plus v25 expansion gate: Japanese and Filipino additions require complete ingredients, equipment, allergens, references, photo search coverage, consistent prep/cook/total timing, meaningful doneness cues, recommended serving defaults, and comprehensive variable-length instructions with no artificial 5- or 6-step cap.'
          m['servingScalePolicy']='Recipe detail opens at each recipe recommended serving count. User adjustments scale ordinary measurable ingredients linearly, while salt and pepper-style seasoning stays at the base amount below 2x and scales when the recipe reaches 2x or more.'
          m['allergenPolicy']='Allergen metadata is merged with ingredient-based inference for soy, gluten, egg, milk, fish, shellfish, nuts, sesame and coconut. Plant milks and nut butters are excluded from false dairy detection.'
          m['cacheFix']='v25.0 uses the 25p1 shell generation and caches the Japanese/Filipino expansion plus every recipe QA/content layer.'
          m['fullQaRelease']='v25.0 adds 40 Japanese and 20 Filipino gap-driven recipes after per-recipe expansion QA, restores Japanese as the largest cuisine and Filipino as second-largest, and hardens allergen inference for nut butters.'
          q=m.setdefault('qualityAuditSnapshot',{})
          q['fullLibrary']={'recipeCount':1118,'uniqueRecipeIds':1118,'criticalStructureFailures':0,'releaseGate':'pending expansion QA'}
          q['standardCuisines']={'recipeCount':647,'Japanese':189,'Filipino':184,'Korean':174,'Chinese':40,'Thai':60,'flaggedRecipes':0,'hierarchy':'Japanese > Filipino > every other standard cuisine'}
          Path('data/library_manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Syntax and structure QA
        run: |
          set -e
          node --check app.js
          node --check service-worker.js
          for f in data/*.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const srcs=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(m=>m[1].split('?')[0]).filter(s=>s.startsWith('data/')&&s.endsWith('.js'));
          const dup=srcs.filter((x,i)=>srcs.indexOf(x)!==i); if(dup.length)throw new Error('duplicate script refs '+dup.join(','));
          for(const f of srcs)if(!fs.existsSync(f))throw new Error('missing '+f);
          const c={console,URL,URLSearchParams,TextDecoder,TextEncoder,atob,btoa,Math,Date,Set,Map,WeakSet,WeakMap,Array,Object,String,Number,Boolean,RegExp,JSON,parseInt,parseFloat,isNaN,encodeURIComponent,decodeURIComponent};c.window=c;c.globalThis=c;vm.createContext(c);
          for(const f of srcs)vm.runInContext(fs.readFileSync(f,'utf8'),c,{filename:f,timeout:8000});
          const lib=c.BENTO_RECIPE_LIBRARY||[];
          if(lib.length!==1118)throw new Error('library count '+lib.length);
          const ids=lib.map(r=>String(r.id)); if(new Set(ids).size!==1118)throw new Error('duplicate IDs');
          const count=x=>lib.filter(r=>r.cuisine===x&&!r.gameDish&&!r.gameSeries&&!r.animeDish&&!r.animeSeries).length;
          const counts={Japanese:count('Japanese'),Filipino:count('Filipino'),Korean:count('Korean'),Chinese:count('Chinese'),Thai:count('Thai')};
          if(counts.Japanese!==189||counts.Filipino!==184||counts.Korean!==174||counts.Chinese!==40||counts.Thai!==60)throw new Error('bad cuisine counts '+JSON.stringify(counts));
          if(!(counts.Japanese>counts.Filipino&&counts.Filipino>Math.max(counts.Korean,counts.Chinese,counts.Thai)))throw new Error('hierarchy failed');
          const fresh=lib.filter(r=>/^jp_(1[5-8]\d|189)$/.test(r.id)||/^ph_(16[5-9]|17\d|18[0-4])$/.test(r.id));
          if(fresh.length!==60)throw new Error('new recipe count '+fresh.length);
          const timing=/\b\d+(?:\s*[–-]\s*\d+)?\s*(?:minutes?|mins?|hours?|hrs?)\b|\b\d+\s*°?C\b/i;
          const cue=/until|should be|look for|golden|tender|set\b|glossy|opaque|puffed|crisp|soft|firm|reduced|coat|bubbl|translucent|aromatic|flake|temperature|reaches at least|ready when|center/i;
          const bad=[];
          for(const r of fresh){
            if(!r.title||!r.category||!r.region||!r.equipment)bad.push([r.id,'details']);
            if(!Number.isFinite(+r.servings)||+r.servings<1)bad.push([r.id,'servings']);
            if(!Number.isFinite(+r.prep)||!Number.isFinite(+r.cook)||!Number.isFinite(+r.total)||+r.total<+r.prep + +r.cook)bad.push([r.id,'time math']);
            if(!Array.isArray(r.ingredients)||r.ingredients.length<6)bad.push([r.id,'ingredients']);
            if(!Array.isArray(r.steps)||r.steps.length<6)bad.push([r.id,'steps']);
            if(+r.cook>=10&&!r.steps.some(s=>timing.test(s)))bad.push([r.id,'timed method']);
            if(+r.cook>0&&!r.steps.some(s=>cue.test(s)))bad.push([r.id,'doneness cue']);
            if(!Array.isArray(r.allergens)||!r.allergens.length)bad.push([r.id,'allergens']);
            if(!Array.isArray(r.sourceUrls)||r.sourceUrls.length<3||r.sourceUrls.some(u=>!/^https:\/\//.test(u)))bad.push([r.id,'references']);
            if(!Array.isArray(r.photoQueries)||r.photoQueries.length<2)bad.push([r.id,'photo queries']);
          }
          if(bad.length)throw new Error('fresh QA failures '+JSON.stringify(bad));
          if(Math.max(...fresh.filter(r=>r.cuisine==='Japanese').map(r=>r.steps.length))<=6)throw new Error('Japanese method cap detected');
          if(Math.max(...fresh.filter(r=>r.cuisine==='Filipino').map(r=>r.steps.length))<=6)throw new Error('Filipino method cap detected');
          const methodGroups=new Map(); for(const r of fresh){const k=r.steps.map(x=>String(x).trim().toLowerCase()).join('|');if(methodGroups.has(k))throw new Error('duplicate new method '+methodGroups.get(k)+' '+r.id);methodGroups.set(k,r.id)}
          const inferred=c.BENTO_INFER_ALLERGENS;
          if(!inferred)throw new Error('allergen runtime missing');
          const pb=inferred(['2 tbsp peanut butter']); if(!pb.includes('nuts')||pb.includes('milk'))throw new Error('peanut butter allergen regression '+JSON.stringify(pb));
          const cm=inferred(['400 ml coconut milk']); if(!cm.includes('coconut')||cm.includes('milk'))throw new Error('coconut milk allergen regression '+JSON.stringify(cm));
          const manifest=JSON.parse(fs.readFileSync('data/library_manifest.json','utf8')); if(manifest.recipeCount!==1118||manifest.japaneseRecipeCount!==189||manifest.filipinoRecipeCount!==184)throw new Error('manifest counts');
          if(!html.includes('japanese-extra-150-169.js?v=25p1')||!html.includes('filipino-extra-165-184.js?v=25p1'))throw new Error('index wiring');
          const sw=fs.readFileSync('service-worker.js','utf8'); if(!sw.includes("ASSET_VERSION='25p1'")||!sw.includes('japanese-extra-171-189.js?v=25p1'))throw new Error('PWA wiring');
          const app=fs.readFileSync('app.js','utf8'); if(!app.includes('const VERSION = 25;'))throw new Error('app version');
          if(/PLACEHOLDER/.test(fs.readFileSync('data/japanese-extra-150-169.js','utf8')))throw new Error('placeholder remains');
          console.log('Expansion QA PASS',counts,'fresh',fresh.length,'step ranges',{
            jp:[Math.min(...fresh.filter(r=>r.cuisine==='Japanese').map(r=>r.steps.length)),Math.max(...fresh.filter(r=>r.cuisine==='Japanese').map(r=>r.steps.length))],
            ph:[Math.min(...fresh.filter(r=>r.cuisine==='Filipino').map(r=>r.steps.length)),Math.max(...fresh.filter(r=>r.cuisine==='Filipino').map(r=>r.steps.length))]
          });
          NODE
      - name: Check expansion photo availability
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const files=['data/recipes-data.js','data/japanese-extra-150-169.js','data/japanese-extra-171-189.js','data/filipino-extra-165-184.js'];
          const c={console,Math,Date,Set,Map,Array,Object,String,Number,Boolean,RegExp,JSON,encodeURIComponent};c.window=c;c.globalThis=c;vm.createContext(c);for(const f of files)vm.runInContext(fs.readFileSync(f,'utf8'),c,{filename:f});
          const rows=(c.BENTO_RECIPE_LIBRARY||[]).filter(r=>/^jp_(1[5-8]\d|189)$/.test(r.id)||/^ph_(16[5-9]|17\d|18[0-4])$/.test(r.id));
          async function hasImage(r){for(const q of r.photoQueries||[]){const u=new URL('https://commons.wikimedia.org/w/api.php');u.search=new URLSearchParams({action:'query',generator:'search',gsrsearch:q,gsrnamespace:'6',gsrlimit:'3',prop:'imageinfo',iiprop:'url|mime',iiurlwidth:'640',format:'json',origin:'*'});try{const res=await fetch(u);if(!res.ok)continue;const d=await res.json();if(Object.values(d?.query?.pages||{}).some(p=>p?.imageinfo?.[0]?.thumburl))return true}catch{}}return false}
          const bad=[]; let i=0; const workers=Array.from({length:6},async()=>{while(i<rows.length){const r=rows[i++];if(!(await hasImage(r)))bad.push(r.id+':'+r.title)}}); Promise.all(workers).then(()=>{if(bad.length){console.error('No Commons image candidates',bad);process.exit(1)}console.log('Photo availability PASS',rows.length)});
          NODE
      - name: Finalize manifest audit snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path('data/library_manifest.json').read_text())
          q=m['qualityAuditSnapshot']; q['fullLibrary']['releaseGate']='pass'
          q['standardCuisines'].update({'flaggedRecipes':0,'allergenFailures':0,'referenceFailures':0,'equipmentFailures':0,'photoMetadataFailures':0})
          q['v25Expansion']={'JapaneseAdded':40,'FilipinoAdded':20,'JapaneseTotal':189,'FilipinoTotal':184,'hierarchy':'Japanese > Filipino > Korean > Thai > Chinese by current counts','recipeFailures':0,'photoAvailabilityFailures':0,'methodPolicy':'variable-length; no artificial 5- or 6-step ceiling'}
          Path('data/library_manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit reviewed expansion
        run: |
          git config user.name 'chachinn'
          git config user.email '140357822+chachinn@users.noreply.github.com'
          git add index.html app.js service-worker.js data/library_manifest.json
          git diff --cached --check
          git commit -m 'Wire Bento v25 Japanese Filipino expansion'
          git push
