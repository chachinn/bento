name: Bento v32 American checkpoint QA

on:
  push:
    branches:
      - bento-v32-american
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bento-v32-american
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage v32 integration in QA workspace
        run: node scripts/integrate-v32-american.mjs
      - name: Run American cuisine checkpoint QA
        run: node scripts/qa-v32-american-checkpoint.mjs
      - name: Run full v32 release regression
        run: node scripts/qa-v32-american-release.mjs
      - name: Commit verified v32 production integration
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html service-worker.js data/library_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Integrate American v32 production library"
            git push origin HEAD:bento-v32-american
          fi
      - name: Package current v32 integrated changes
        if: success()
        run: |
          zip -r bento-v32-american-changes.zip \
            .github/workflows/qa-v32-american-checkpoint.yml \
            scripts/integrate-v32-american.mjs \
            scripts/qa-v32-american-checkpoint.mjs \
            scripts/qa-v32-american-release.mjs \
            index.html \
            service-worker.js \
            data/library_manifest.json \
            data/american-runtime.js \
            data/american-recipes-*.js \
            data/recipe-quality-runtime.js
      - name: Upload current v32 changes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bento-v32-american-changes
          path: bento-v32-american-changes.zip
          if-no-files-found: error
          retention-days: 7
