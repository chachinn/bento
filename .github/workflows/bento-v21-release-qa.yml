name: Bento v21 reviewed QA release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bento-v21-release-qa.yml'

permissions:
  contents: write

jobs:
  qa-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate patch script
        run: python3 -m py_compile tools/bento_v21_qa_patch.py

      - name: Apply reviewed fixes
        run: python3 tools/bento_v21_qa_patch.py

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          for f in data/*.js; do node --check "$f"; done

      - name: Structure and PWA QA
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,re

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__();self.ids=[];self.views=set();self.links=[];self.navs=[];self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if a.get('id'): self.ids.append(a['id'])
                  if 'data-view' in a: self.views.add(a['data-view'])
                  if 'data-view-link' in a: self.links.append(a['data-view-link'])
                  if 'data-nav' in a: self.navs.append(a['data-nav'])
                  if tag=='script' and a.get('src'): self.scripts.append(a['src'])

          html=Path('index.html').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          p=Audit();p.feed(html)

          duplicates=sorted({x for x in p.ids if p.ids.count(x)>1})
          assert not duplicates, f'duplicate IDs: {duplicates}'
          assert set(p.links)<=p.views, f'broken view links: {set(p.links)-p.views}'
          assert set(p.navs)<=p.views, f'broken nav links: {set(p.navs)-p.views}'
          required={'home','plan','recipes','pantry','grocery','smart','cookwith','bentobox','leftovers','ideas','templates','collections','favorites','history','activity','waste','insights','settings','about'}
          assert required<=p.views, f'missing views: {required-p.views}'

          direct=set(re.findall(r"\$\('#([A-Za-z0-9_-]+)'\)\??\.addEventListener",app))
          assert direct<=set(p.ids), f'listener IDs missing from HTML: {sorted(direct-set(p.ids))}'

          for src in p.scripts:
              path=src.split('?',1)[0]
              assert Path(path).exists(), f'missing script asset: {path}'

          core=re.search(r'const CORE=\[(.*?)\];',sw,re.S)
          assert core, 'service worker CORE missing'
          for asset in re.findall(r"'([^']+)'",core.group(1)):
              path=asset.removeprefix('./').split('?',1)[0]
              assert Path(path).exists(), f'missing service-worker asset: {path}'

          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          library=json.loads(Path('data/library_manifest.json').read_text(encoding='utf-8'))
          for icon in manifest.get('icons',[]):
              assert Path(icon['src']).exists(), f"missing icon: {icon['src']}"

          assert html.count('data-recipe-browse=')>=6, 'all six recipe browse tabs are required'
          for cls in ['cuisine-browse-select','meal-browse-select','dessert-browse-select','drink-browse-select','anime-browse-select']:
              assert cls in app, f'missing recipe selector: {cls}'
          assert "filter==='NeverCooked'" in app
          assert "Side Dishes','Soups & Hot Pots" in app
          assert 'defaultLeftoverDays' in app
          assert "aria-current','page'" in app
          assert 'URL.revokeObjectURL' in app
          assert '</span></span><button data-grocery-delete=' not in app
          assert 'That section could not refresh' not in app
          assert 'Bento v21 QA UI normalization' in css
          assert 'bento-shell-v0.7.3-v21' in sw
          assert 'no longer rewrites app or HTML source' in library.get('cacheFix','')

          stripped=re.sub(r'/\*.*?\*/','',css,flags=re.S)
          assert stripped.count('{')==stripped.count('}'), 'CSS brace mismatch'

          forbidden=['v19-ui.js','v19-cuisine.css','v20-ui.js','v20-ui.css','v20-perf.js','v20-perf.css']
          assert not [f for f in forbidden if Path(f).exists()], 'legacy sidecar file returned'
          print(f'QA OK: {len(p.views)} views, {len(p.ids)} unique IDs, {len(p.scripts)} scripts; navigation and PWA assets validated.')
          PY
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool data/library_manifest.json >/dev/null
          git diff --check

      - name: Remove temporary QA files
        run: |
          rm -f tools/bento_v21_qa_patch.py
          rm -f .github/workflows/bento-v21-release-qa.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit only after QA passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chachinn"
          git config user.email "140357822+chachinn@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bento v21: full regression QA and stability cleanup [skip ci]"
          git push origin main
