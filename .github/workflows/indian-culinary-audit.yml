name: Indian Culinary Accuracy Audit
on:
  push:
    branches: [audit-indian-culinary-accuracy]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare production release files
        run: node qa/prepare-indian-culinary-release.js
      - name: Run culinary audit
        run: node qa/indian-culinary-audit.js
      - name: Run full Bento regression
        run: node qa/full-library-regression.js
      - name: Commit release files only after both gates pass
        run: |
          if git diff --quiet -- index.html service-worker.js data/library_manifest.json; then
            echo "No production release changes to commit."
            exit 0
          fi
          git config user.name "chachinn"
          git config user.email "140357822+chachinn@users.noreply.github.com"
          git add index.html service-worker.js data/library_manifest.json
          git commit -m "fix: finalize Indian culinary accuracy release"
          git push
