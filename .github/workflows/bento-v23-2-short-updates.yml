name: Bento v23.2 short usability QA

on:
  push:
    branches: [bento-chinese-v23]
    paths:
      - '.github/workflows/bento-v23-2-short-updates.yml'

permissions:
  contents: write

jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Start from current production
        run: |
          git fetch origin main
          git checkout -B short-update origin/main

      - name: Apply v23.2 updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          app_path=Path('app.js')
          app=app_path.read_text(encoding='utf-8')

          # Pantry bulk-selection state.
          anchor="let recipeDetailId='', recipeDetailServingTarget=null, recipeDetailChecked=new Set();"
          assert anchor in app
          app=app.replace(anchor,anchor+"\n  let pantrySelectionMode=false, pantrySelectedIds=new Set();",1)

          # Prefer source-world artwork for Genshin/Anime, with existing food-photo fallback.
          old="function recipePhotoPlan(r){const plan=RECIPE_PHOTO_INDEX[r?.id];if(plan)return plan;const title=String(r?.title||'Recipe'),cuisine=String(r?.cuisine||'');return{id:r?.id||photoHash(title),kind:'recipe',title,queries:[`${title} ${cuisine} food`.trim(),`${title} food`]}}"
          new="""function recipePhotoPlan(r){const plan=RECIPE_PHOTO_INDEX[r?.id];if(plan)return plan;const gameApp=activeGameAppearance(r),gameTitle=String(gameApp?.title||(typeof r?.gameDish==='string'?r.gameDish:'')||r?.title||'').trim();if((gameApp?.series==='Genshin Impact'||r?.gameSeries==='Genshin Impact'||r?.collection==='Genshin Impact')&&gameTitle)return{id:r?.id||photoHash(gameTitle),kind:'recipe',special:'genshin',title:gameTitle,queries:[`${gameTitle} food`,`${r?.title||gameTitle} food`]};if(r?.animeSeries)return{id:r?.id||photoHash(r?.title||r.animeSeries),kind:'recipe',special:'anime',series:String(r.animeSeries),title:String(r?.animeDishName||r?.title||r.animeSeries),queries:[`${r?.realWorldDish||r?.title||''} food`,`${r?.animeDishName||r?.title||''} food`]};const title=String(r?.title||'Recipe'),cuisine=String(r?.cuisine||'');return{id:r?.id||photoHash(title),kind:'recipe',title,queries:[`${title} ${cuisine} food`.trim(),`${title} food`]}}"""
          assert old in app
          app=app.replace(old,new,1)

          old="async function resolvePhotoMeta(plan,variant=0){if(!plan)return null;const qs=Array.isArray(plan.queries)?plan.queries:[];let weak=null;for(const q of qs){if(!q)continue;const meta=await commonsSearchOne(q,plan.kind||'recipe',variant);if(meta&&!meta.missing){if((meta.score??0)>=2)return meta;if(!weak)weak=meta}}return weak}"
          new="""async function genshinArtworkSearch(plan){if(!navigator.onLine||!plan?.title)return null;const key=photoHash(`genshin-art:${plan.title.toLowerCase()}`),cached=await cacheJsonGet(key);if(cached)return cached.missing?null:cached;try{const u=new URL('https://genshin-impact.fandom.com/api.php');u.search=new URLSearchParams({action:'query',generator:'search',gsrsearch:`${plan.title} icon`,gsrnamespace:'6',gsrlimit:'10',prop:'imageinfo',iiprop:'url|mime|size',iiurlwidth:'640',format:'json',origin:'*'}).toString();const res=await fetch(u,{mode:'cors',credentials:'omit',cache:'no-store'});if(!res.ok)throw new Error('genshin art search failed');const pages=Object.values((await res.json())?.query?.pages||{}).filter(p=>p?.imageinfo?.[0]?.thumburl),tokens=searchTokens(plan.title);pages.sort((a,b)=>{const score=p=>{const t=String(p.title||'').toLowerCase();let s=/icon/.test(t)?5:0;for(const x of tokens)if(t.includes(x))s+=3;return s};return score(b)-score(a)});const pick=pages[0];if(!pick){await cacheJsonPut(key,{missing:true});return null}const ii=pick.imageinfo[0],out={url:ii.thumburl,page:ii.descriptionurl||'',license:'Game artwork',artist:'Genshin Impact Wiki source',title:String(pick.title||'').replace(/^File:/,''),score:20,query:plan.title};await cacheJsonPut(key,out);return out}catch{return null}}
          async function animeArtworkSearch(plan){if(!navigator.onLine||!plan?.series)return null;const key=photoHash(`anime-art:${plan.series.toLowerCase()}`),cached=await cacheJsonGet(key);if(cached)return cached.missing?null:cached;try{const u=new URL('https://api.jikan.moe/v4/anime');u.search=new URLSearchParams({q:plan.series,limit:'1'}).toString();const res=await fetch(u,{mode:'cors',credentials:'omit',cache:'no-store'});if(!res.ok)throw new Error('anime art search failed');const hit=(await res.json())?.data?.[0],url=hit?.images?.webp?.large_image_url||hit?.images?.jpg?.large_image_url||hit?.images?.webp?.image_url||hit?.images?.jpg?.image_url;if(!url){await cacheJsonPut(key,{missing:true});return null}const out={url,page:hit?.url||'',license:'Anime series artwork',artist:'Series artwork via Jikan',title:`${plan.series} artwork`,score:20,query:plan.series};await cacheJsonPut(key,out);return out}catch{return null}}
          async function resolvePhotoMeta(plan,variant=0){if(!plan)return null;if(plan.special==='genshin'){const art=await genshinArtworkSearch(plan);if(art)return art}if(plan.special==='anime'){const art=await animeArtworkSearch(plan);if(art)return art}const qs=Array.isArray(plan.queries)?plan.queries:[];let weak=null;for(const q of qs){if(!q)continue;const meta=await commonsSearchOne(q,plan.kind||'recipe',variant);if(meta&&!meta.missing){if((meta.score??0)>=2)return meta;if(!weak)weak=meta}}return weak}"""
          assert old in app
          app=app.replace(old,new,1)

          # Collapsible Genshin region section.
          old="panel.innerHTML=seriesCards+`<div class=\"type-card-grid game-region-grid\"><button class=\"type-card ${recipeFilter==='Collection:Genshin Impact'?'selected':''}\" data-game-series=\"Genshin Impact\"><span>✦</span><b>All</b><small>${gr.length} recipes</small></button>${regions.map(region=>{const n=gr.filter(r=>r.gameRegion===region||recipeGameAppearances(r).some(a=>a.region===region)).length,icon=({Mondstadt:'🍃',Liyue:'🏮',Inazuma:'🌸',Sumeru:'🌿',Fontaine:'💧',Natlan:'🔥','Nod-Krai':'🌙'})[region]||'✦';return `<button class=\"type-card ${recipeFilter===`GenshinRegion:${region}`?'selected':''}\" data-genshin-region=\"${region}\"><span>${icon}</span><b>${region}</b><small>${n} recipes</small></button>`}).join('')}</div>`;"
          new="panel.innerHTML=seriesCards+`<div class=\"game-region-heading\"><span>Regions</span><button type=\"button\" class=\"text-btn\" data-game-collapse>Hide regions⌃</button></div><div class=\"type-card-grid game-region-grid\"><button class=\"type-card ${recipeFilter==='Collection:Genshin Impact'?'selected':''}\" data-game-series=\"Genshin Impact\"><span>✦</span><b>All</b><small>${gr.length} recipes</small></button>${regions.map(region=>{const n=gr.filter(r=>r.gameRegion===region||recipeGameAppearances(r).some(a=>a.region===region)).length,icon=({Mondstadt:'🍃',Liyue:'🏮',Inazuma:'🌸',Sumeru:'🌿',Fontaine:'💧',Natlan:'🔥','Nod-Krai':'🌙'})[region]||'✦';return `<button class=\"type-card ${recipeFilter===`GenshinRegion:${region}`?'selected':''}\" data-genshin-region=\"${region}\"><span>${icon}</span><b>${region}</b><small>${n} recipes</small></button>`}).join('')}</div>`;"
          assert old in app
          app=app.replace(old,new,1)
          marker="const gameSeries=e.target.closest('[data-game-series]');if(gameSeries){recipeFilter=`Collection:${gameSeries.dataset.gameSeries}`;recipeCuisineFilter='All';recipeRenderLimit=RECIPE_RENDER_BATCH;renderRecipes();return}"
          assert marker in app
          app=app.replace(marker,"if(e.target.closest('[data-game-collapse]')){recipeFilter='Games';recipeCuisineFilter='All';recipeRenderLimit=RECIPE_RENDER_BATCH;renderRecipes();return}\n    "+marker,1)

          # Plan summary + recipe-open behavior carrying planned servings.
          pattern=r"  function renderPlan\(\)\{.*?\n\n  function recipeGameAppearances"
          m=re.search(pattern,app,re.S);assert m
          replacement="""  function renderPlan(){const dates=weekDates(),todayKey=dateKey(new Date());$('#weekLabel').textContent=`${formatShortDate(dates[0])} – ${formatShortDate(dates[6])}`;$('#weekDays').innerHTML=dates.map(d=>`<div class=\"day-pill ${dateKey(d)===todayKey?'today':''}\"><b>${d.toLocaleDateString(undefined,{weekday:'short'})}</b><span>${d.getDate()}</span></div>`).join('');const planned=[];for(const d of dates){const key=dateKey(d),day=state.mealPlan[key]||{};for(const slot of activeMealSlots()){const item=day[slot],r=getRecipe(item?.recipeId);if(r)planned.push({key,d,slot,item,r})}}const summary=planned.length?`<section class=\"plan-week-summary\"><div class=\"plan-summary-head\"><div><p class=\"eyebrow\">This week</p><h3>Planned recipes</h3></div><small>${planned.length} meal${planned.length===1?'':'s'}</small></div><div class=\"plan-summary-list\">${planned.map(x=>`<button type=\"button\" class=\"plan-summary-recipe\" data-recipe-id=\"${x.r.id}\" data-recipe-serving=\"${Number(x.item.servings)||Number(x.r.servings)||2}\"><span>${foodEmoji(x.r)}</span><span><b>${esc(x.r.title)}</b><small>${esc(x.d.toLocaleDateString(undefined,{weekday:'short'}))} · ${esc(x.slot)} · ${Number(x.item.servings)||Number(x.r.servings)||2} servings</small></span><i>›</i></button>`).join('')}</div></section>`:'';const days=dates.map(d=>{const key=dateKey(d),p=state.mealPlan[key]||{};return `<article class=\"plan-day\"><div class=\"plan-day-head\"><b>${esc(formatLongDate(d))}</b><small>${key===todayKey?'Today':''}</small></div>${activeMealSlots().map(slot=>{const item=p[slot];if(item?.recipeId){const r=getRecipe(item.recipeId);if(r){const servings=Number(item.servings)||Number(r.servings)||2,sub=`${totalTime(r)} min · ${servings} servings${item.prepNote?` · ${item.prepNote}`:''}${item.extraPortions?` · +${item.extraPortions} leftover${item.extraPortions===1?'':'s'}`:''}`;return `<div class=\"plan-slot filled\"><span>${slot}</span><button type=\"button\" class=\"plan-slot-recipe\" data-recipe-id=\"${r.id}\" data-recipe-serving=\"${servings}\"><b>${esc(r.title)}</b><small>${esc(sub)}</small></button><button type=\"button\" class=\"plan-slot-edit\" data-meal-date=\"${key}\" data-meal-slot=\"${slot}\" aria-label=\"Edit ${esc(slot)}\">•••</button></div>`}}if(item?.custom)return `<div class=\"plan-slot filled\"><span>${slot}</span><button type=\"button\" class=\"plan-slot-recipe\" data-meal-date=\"${key}\" data-meal-slot=\"${slot}\"><b>${esc(item.custom)}</b><small>${esc(item.prepNote||'Custom meal')}</small></button><button type=\"button\" class=\"plan-slot-edit\" data-meal-date=\"${key}\" data-meal-slot=\"${slot}\" aria-label=\"Edit ${esc(slot)}\">•••</button></div>`;return `<button type=\"button\" class=\"plan-slot empty\" data-meal-date=\"${key}\" data-meal-slot=\"${slot}\"><span>${slot}</span><div><b>Add meal</b></div><i class=\"plan-add\">+</i></button>`}).join('')}</article>`}).join('');$('#mealPlanGrid').innerHTML=summary+days}

  function recipeGameAppearances"""
          app=app[:m.start()]+replacement+app[m.end():]

          # Planner recipe search helper.
          anchor="function recipeOptions(){if(recipeOptionsHtmlCache)return recipeOptionsHtmlCache;recipeOptionsHtmlCache='<option value=\"\">Choose recipe…</option>'+standardRecipePool().sort((a,b)=>a.title.localeCompare(b.title)).map(r=>`<option value=\"${r.id}\">${esc(r.title)}</option>`).join('');return recipeOptionsHtmlCache}"
          assert anchor in app
          helper="""function mealRecipeOptions(query='',selected=''){const q=String(query||'').trim().toLowerCase(),rows=[...standardRecipePool()].sort((a,b)=>a.title.localeCompare(b.title)),filtered=q?rows.filter(r=>recipeSearchText(r).includes(q)):rows;let html='<option value=\"\">Choose recipe…</option>'+filtered.map(r=>`<option value=\"${r.id}\">${esc(r.title)}</option>`).join('');if(selected&&!filtered.some(r=>r.id===selected)){const r=getRecipe(selected);if(r)html+=`<option value=\"${r.id}\">${esc(r.title)}</option>`}return html}
  function applyMealRecipeSearch(query=''){const select=$('#mealRecipeSelect');if(!select)return;const selected=select.value;select.innerHTML=mealRecipeOptions(query,selected);if(selected)select.value=selected}"""
          app=app.replace(anchor,anchor+"\n  "+helper,1)

          old="function openMealForm(date,slot){const cur=state.mealPlan[date]?.[slot];$('#mealDateInput').value=date;$('#mealSlotInput').value=slot;$('#mealDialogDate').textContent=parseDate(date).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});$('#mealDialogTitle').textContent=slot[0].toUpperCase()+slot.slice(1);const selectedRecipeId=cur?.recipeId||pendingPlanRecipeId||'';$('#mealRecipeSelect').innerHTML=recipeOptions();"
          new="function openMealForm(date,slot){const cur=state.mealPlan[date]?.[slot];$('#mealDateInput').value=date;$('#mealSlotInput').value=slot;$('#mealDialogDate').textContent=parseDate(date).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});$('#mealDialogTitle').textContent=slot[0].toUpperCase()+slot.slice(1);const selectedRecipeId=cur?.recipeId||pendingPlanRecipeId||'';if($('#mealRecipeSearchInput'))$('#mealRecipeSearchInput').value='';$('#mealRecipeSelect').innerHTML=mealRecipeOptions('',selectedRecipeId);"
          assert old in app
          app=app.replace(old,new,1)

          # Open planned recipe at its planned serving count.
          old="function openRecipeDetail(id){const r=getRecipe(id);if(!r)return;recipeDetailId=id;recipeDetailServingTarget=Number(r.servings)||2;"
          new="function openRecipeDetail(id,servingTarget=null){const r=getRecipe(id);if(!r)return;recipeDetailId=id;recipeDetailServingTarget=clamp(Number(servingTarget)||Number(r.servings)||2,1,30);"
          assert old in app
          app=app.replace(old,new,1)
          old="const rid=e.target.closest('[data-recipe-id]');if(rid){openRecipeDetail(rid.dataset.recipeId);return}"
          new="const rid=e.target.closest('[data-recipe-id]');if(rid){openRecipeDetail(rid.dataset.recipeId,Number(rid.dataset.recipeServing)||null);return}"
          assert old in app
          app=app.replace(old,new,1)

          # Scale direct grocery additions to the currently selected serving count.
          pattern=r"  function addRecipeIngredientsToGrocery\(r,missingOnly=false\)\{.*?\n\n  function generateGroceriesFromWeek"
          m=re.search(pattern,app,re.S);assert m
          replacement="""  function addRecipeIngredientsToGrocery(r,missingOnly=false,targetServings=null){const pantry=state.pantry.map(p=>p.name),baseServings=Math.max(1,Number(r.servings)||1),wanted=Math.max(1,Number(targetServings)||baseServings),factor=wanted/baseServings;let lines=(r.ingredients||[]).map(line=>Math.abs(factor-1)<.001?line:scaleIngredientLine(line,factor));if(missingOnly)lines=lines.filter(i=>!pantry.some(p=>ingredientMatches(i,p)));const addedIds=[];for(const line of lines){const name=ingredientName(line)||line.trim();if(!name)continue;const ex=state.grocery.find(g=>ingredientMatches(g.ingredientName||g.text,name)&&!g.checked);if(!ex){const g={id:uid('g'),text:line.trim(),ingredientName:name,checked:false,category:groceryCategory(line),source:`recipe:${r.id}`,sourceServings:wanted};state.grocery.push(g);addedIds.push(g.id)}}commit();toast(addedIds.length?`${addedIds.length} item${addedIds.length===1?'':'s'} added for ${wanted} serving${wanted===1?'':'s'}`:'Everything is already listed',addedIds.length?()=>{state.grocery=state.grocery.filter(g=>!addedIds.includes(g.id))}:null)}

  function generateGroceriesFromWeek"""
          app=app[:m.start()]+replacement+app[m.end():]
          old="const dg=e.target.closest('[data-detail-grocery]');if(dg){const r=getRecipe(dg.dataset.detailGrocery);if(r)addRecipeIngredientsToGrocery(r,false);return}"
          new="const dg=e.target.closest('[data-detail-grocery]');if(dg){const r=getRecipe(dg.dataset.detailGrocery);if(r)addRecipeIngredientsToGrocery(r,false,recipeDetailServingTarget);return}"
          assert old in app;app=app.replace(old,new,1)
          old="const dgm=e.target.closest('[data-detail-grocery-missing]');if(dgm){const r=getRecipe(dgm.dataset.detailGroceryMissing);if(r)addRecipeIngredientsToGrocery(r,true);return}"
          new="const dgm=e.target.closest('[data-detail-grocery-missing]');if(dgm){const r=getRecipe(dgm.dataset.detailGroceryMissing);if(r)addRecipeIngredientsToGrocery(r,true,recipeDetailServingTarget);return}"
          assert old in app;app=app.replace(old,new,1)

          # Pantry multi-select renderer.
          pattern=r"\n\n  function renderPantry\(\)\{.*?\n\n  function grocerySourceLabel"
          m=re.search(pattern,app,re.S);assert m
          replacement="""

  function filteredPantryItems(){const q=($('#pantrySearch')?.value||'').trim().toLowerCase();let list=state.pantry.filter(p=>!q||`${p.name} ${p.location} ${p.store||''}`.toLowerCase().includes(q));if(pantryFilter==='Expiring Soon')list=list.filter(p=>{const d=daysUntil(p.expiry);return d>=0&&d<=expiryWindow()});else if(pantryFilter==='Low Stock')list=list.filter(p=>p.lowStock);else if(pantryFilter!=='All')list=list.filter(p=>p.location===pantryFilter);if(pantrySort==='expiry')list.sort((a,b)=>(daysUntil(a.expiry)-daysUntil(b.expiry))||a.name.localeCompare(b.name));else list.sort((a,b)=>a.name.localeCompare(b.name));return list}
  function syncPantrySelectionBar(){const bar=$('#pantryBulkBar'),count=$('#pantrySelectedCount'),toggle=$('#pantrySelectButton');bar?.classList.toggle('hidden',!pantrySelectionMode);if(count)count.textContent=`${pantrySelectedIds.size} selected`;if(toggle){toggle.classList.toggle('active',pantrySelectionMode);toggle.textContent=pantrySelectionMode?'Done':'Select'}}
  function renderPantry(){const opts=['All','Expiring Soon','Low Stock','Fridge','Freezer','Pantry','Spice Rack','Other'];$('#pantryFilters').innerHTML=opts.map(c=>`<button class=\"chip ${pantryFilter===c?'active':''}\" data-pantry-filter=\"${esc(c)}\">${esc(c)}</button>`).join('');const list=filteredPantryItems();$('#pantrySortButton').textContent=pantrySort==='expiry'?'Expiry':'A–Z';syncPantrySelectionBar();const visible=list.slice(0,pantryRenderLimit);$('#pantryList').innerHTML=list.length?visible.map(p=>{const due=daysUntil(p.expiry);let status='';if(Number.isFinite(due)){if(due<0)status='<span class=\"status-pill warn\">Expired</span>';else if(due<=expiryWindow())status=`<span class=\"status-pill warn\">${due===0?'Today':`${due}d left`}</span>`;else status=`<span class=\"status-pill\">${due}d left</span>`}if(p.lowStock)status+='<span class=\"status-pill warn\">Low stock</span>';if(p.staple)status+='<span class=\"status-pill\">Staple</span>';const body=`<span class=\"emoji ingredient-emoji\">${ingredientVisual(p.name,'ingredient-thumb ingredient-thumb-sm')}</span><span class=\"content\"><b>${esc(p.name)}</b><small>${esc(`${p.quantity??''} ${p.unit||''}`.trim()||'Quantity not set')} · ${esc(p.location)}${p.opened?` · opened ${esc(p.opened)}`:''}</small>${status}</span>`;return pantrySelectionMode?`<label class=\"list-card pantry-select-card ${pantrySelectedIds.has(p.id)?'selected':''}\"><input type=\"checkbox\" data-pantry-select=\"${p.id}\" ${pantrySelectedIds.has(p.id)?'checked':''}>${body}</label>`:`<button class=\"list-card\" data-pantry-id=\"${p.id}\">${body}<span class=\"meta\">›</span></button>`}).join('')+(list.length>visible.length?`<div class=\"load-more-wrap\"><button class=\"soft-btn load-more-btn\" data-load-more-pantry>Show more · ${list.length-visible.length} remaining</button></div>`:''):emptyCard(state.pantry.length?'No pantry items match this filter.':'Your pantry is empty. Add what you already have at home.','Add pantry item','add-pantry')}

  function grocerySourceLabel"""
          app=app[:m.start()]+replacement+app[m.end():]

          # Search button: keep focus inside the original user gesture on iOS.
          old="$('#quickAddButton').addEventListener('click',()=>openDialog($('#quickAddDialog')));$('#brandButton').addEventListener('click',()=>navigate('about'));$('#searchButton').addEventListener('click',()=>{navigate('recipes');setTimeout(()=>$('#recipeSearch').focus(),80)});"
          new="$('#quickAddButton').addEventListener('click',()=>openDialog($('#quickAddDialog')));$('#brandButton').addEventListener('click',()=>navigate('about'));$('#searchButton').addEventListener('click',()=>{navigate('recipes');const input=$('#recipeSearch');if(input){try{input.focus({preventScroll:true});input.setSelectionRange(input.value.length,input.value.length)}catch{input.focus()}input.scrollIntoView({block:'center'})}});"
          assert old in app;app=app.replace(old,new,1)

          # Meal picker search, grocery bulk actions, pantry bulk actions.
          old="$('#mealRecipeSelect').addEventListener('change',()=>{if($('#mealRecipeSelect').value){$('#mealCustomInput').value='';const r=getRecipe($('#mealRecipeSelect').value);if(r)$('#mealServingsInput').value=r.servings||state.settings.defaultServings||2}});$('#mealCustomInput').addEventListener('input',()=>{if($('#mealCustomInput').value.trim())$('#mealRecipeSelect').value=''})"
          new="$('#mealRecipeSelect').addEventListener('change',()=>{if($('#mealRecipeSelect').value){$('#mealCustomInput').value='';const r=getRecipe($('#mealRecipeSelect').value);if(r)$('#mealServingsInput').value=r.servings||state.settings.defaultServings||2}});$('#mealRecipeSearchInput')?.addEventListener('input',debounce(e=>applyMealRecipeSearch(e.target.value),80));$('#mealCustomInput').addEventListener('input',()=>{if($('#mealCustomInput').value.trim())$('#mealRecipeSelect').value=''})"
          assert old in app;app=app.replace(old,new,1)

          old="$('#generateGroceriesButton').addEventListener('click',()=>{generateGroceriesFromWeek();navigate('grocery')});$('#groceryFromPlanButton').addEventListener('click',generateGroceriesFromWeek);$('#addLowStockToGrocery').addEventListener('click',lowStockToGrocery);$('#checkedToPantryButton').addEventListener('click',checkedToPantry);"
          new="$('#generateGroceriesButton').addEventListener('click',()=>{generateGroceriesFromWeek();navigate('grocery')});$('#groceryFromPlanButton').addEventListener('click',generateGroceriesFromWeek);$('#addLowStockToGrocery').addEventListener('click',lowStockToGrocery);$('#checkedToPantryButton').addEventListener('click',checkedToPantry);$('#groceryCheckAllButton')?.addEventListener('click',()=>{if(!state.grocery.length){toast('Your grocery list is empty');return}state.grocery.forEach(g=>g.checked=true);commit();toast('All grocery items checked')});$('#groceryUncheckAllButton')?.addEventListener('click',()=>{state.grocery.forEach(g=>g.checked=false);commit();toast('All grocery items unchecked')});"
          assert old in app;app=app.replace(old,new,1)

          old="$('#matchRecipesButton').addEventListener('click',()=>{matchRenderLimit=MATCH_RENDER_BATCH;renderCookMatches()});"
          new="$('#pantrySelectButton')?.addEventListener('click',()=>{pantrySelectionMode=!pantrySelectionMode;if(!pantrySelectionMode)pantrySelectedIds.clear();renderPantry()});$('#pantrySelectAllButton')?.addEventListener('click',()=>{const ids=filteredPantryItems().map(p=>p.id),all=ids.length&&ids.every(id=>pantrySelectedIds.has(id));ids.forEach(id=>all?pantrySelectedIds.delete(id):pantrySelectedIds.add(id));renderPantry()});$('#pantryDeleteSelectedButton')?.addEventListener('click',()=>{const ids=[...pantrySelectedIds];if(!ids.length){toast('Select pantry items first');return}if(!confirm(`Delete ${ids.length} selected pantry item${ids.length===1?'':'s'}?`))return;const removed=state.pantry.filter(p=>pantrySelectedIds.has(p.id)).map(cloneData);state.pantry=state.pantry.filter(p=>!pantrySelectedIds.has(p.id));pantrySelectedIds.clear();pantrySelectionMode=false;commit();toast(`${removed.length} pantry item${removed.length===1?'':'s'} deleted`,()=>state.pantry.push(...removed))});\n  $('#matchRecipesButton').addEventListener('click',()=>{matchRenderLimit=MATCH_RENDER_BATCH;renderCookMatches()});"
          assert old in app;app=app.replace(old,new,1)

