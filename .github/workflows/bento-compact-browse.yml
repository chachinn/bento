name: Bento compact recipe browse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bento-compact-browse.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make recipe browse compact
        run: python3 -c "import base64;exec(base64.b64decode(''))"

      - name: Validate
        run: |
          node --check app.js
          node --check service-worker.js
          git diff --check
          test ! -f .github/workflows/bento-compact-browse.yml

      - name: Commit update
        run: |
          git config user.name "chachinn"
          git config user.email "140357822+chachinn@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Bento v21: compact recipe browse dropdowns [skip ci]"
          git push origin HEAD:main
