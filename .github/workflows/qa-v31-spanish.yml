name: Bento v31 Spanish integration QA

on:
  push:
    branches:
      - bento-v31-spanish
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: bento-v31-spanish
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate Spanish v31
        run: node scripts/integrate-v31-spanish.mjs
      - name: Run Bento v31 release QA
        run: node scripts/qa-v31-spanish.mjs
      - name: Commit verified production integration
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- index.html service-worker.js data/library_manifest.json data/spanish-recipes-027-031.js data/spanish-v31-quality-fixes.js; then
            echo "No production integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html service-worker.js data/library_manifest.json data/spanish-recipes-027-031.js data/spanish-v31-quality-fixes.js
          git commit -m "Integrate Spanish v31 production library"
          git push origin HEAD:bento-v31-spanish
