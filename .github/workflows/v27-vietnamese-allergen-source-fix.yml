name: Fix Vietnamese coconut allergen metadata
on:
  push:
    branches: [bento-vietnamese-v27]
permissions:
  contents: write
jobs:
  fix-source-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct source allergen arrays
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          fixes=[
            ('data/vietnamese-recipes-021-030.js','vn_022'),
            ('data/vietnamese-recipes-101-110.js','vn_101'),
          ]
          for filename,rid in fixes:
              p=Path(filename); s=p.read_text()
              pattern=rf'("id":"{rid}".*?"allergens":)\["fish"\]'
              s2,n=re.subn(pattern,rf'\1["fish","coconut"]',s,count=1)
              assert n==1, f'{rid}: expected one allergen replacement, got {n}'
              p.write_text(s2)
          PY
          node --check data/vietnamese-recipes-021-030.js
          node --check data/vietnamese-recipes-101-110.js
          grep -q '"id":"vn_022".*"allergens":\["fish","coconut"\]' data/vietnamese-recipes-021-030.js
          grep -q '"id":"vn_101".*"allergens":\["fish","coconut"\]' data/vietnamese-recipes-101-110.js
          git diff --check
      - name: Commit source metadata fix
        run: |
          git config user.name 'chachinn'
          git config user.email '140357822+chachinn@users.noreply.github.com'
          git add data/vietnamese-recipes-021-030.js data/vietnamese-recipes-101-110.js
          git diff --cached --check
          git commit -m 'Fix Vietnamese coconut allergen metadata'
          git push
