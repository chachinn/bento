name: Bento Japanese gap checkpoint QA

on:
  push:
    branches:
      - bento-japanese-gap-expansion
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Japanese extension syntax
        run: |
          node --check data/japanese-extra-190-194.js
          node --check data/japanese-extra-195-198.js
          node --check data/japanese-extra-199-207.js
      - name: Audit full Japanese coverage inventory
        run: node scripts/audit-japanese-coverage.mjs
      - name: Run Japanese regional gap QA
        run: node scripts/qa-japanese-gap-checkpoint.mjs
      - name: Run corrected full-runtime Japanese QA
        run: node scripts/qa-japanese-runtime-final.mjs
      - name: Stage Japanese v31.1 integration
        run: node scripts/integrate-japanese-gap.mjs
      - name: Run full Japanese release regression
        run: node scripts/qa-japanese-release.mjs
      - name: Commit integrated release files to branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- index.html service-worker.js data/library_manifest.json; then
            git config user.name 'chachinn'
            git config user.email '140357822+chachinn@users.noreply.github.com'
            git add index.html service-worker.js data/library_manifest.json
            git commit -m 'Integrate Japanese v31.1 regional completion'
            git push origin HEAD:bento-japanese-gap-expansion
          fi
