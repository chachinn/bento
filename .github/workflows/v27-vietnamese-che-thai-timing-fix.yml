name: Fix Vietnamese Che Thai timing metadata
on:
  push:
    branches: [bento-vietnamese-v27]
permissions:
  contents: write
jobs:
  fix-source-timing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct Che Thai timing and method cue
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('data/vietnamese-recipes-111-120.js');s=p.read_text()
          pattern=r'("id":"vn_118","title":"Chè Thái","region":"Ho Chi Minh City / Southern Vietnam","category":"Sweets & Desserts","servings":6,)"prep":35,"cook":20,"total":95'
          s,n=re.subn(pattern,r'\1"prep":20,"cook":5,"total":50',s,count=1)
          assert n==1, f'vn_118 timing replacement count {n}'
          old='If using fresh coconut milk that requires heating, bring it just to a brief simmer, then cool rapidly before combining with milk and fruit.'
          new='If using fresh coconut milk that requires heating, bring it just to a brief simmer for 2–3 minutes, then cool rapidly before combining with milk and fruit.'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check data/vietnamese-recipes-111-120.js
          grep -q '"id":"vn_118".*"prep":20,"cook":5,"total":50' data/vietnamese-recipes-111-120.js
          grep -q 'brief simmer for 2–3 minutes' data/vietnamese-recipes-111-120.js
          git diff --check
      - name: Commit source timing fix
        run: |
          git config user.name 'chachinn'
          git config user.email '140357822+chachinn@users.noreply.github.com'
          git add data/vietnamese-recipes-111-120.js
          git diff --cached --check
          git commit -m 'Fix Che Thai timing metadata'
          git push
