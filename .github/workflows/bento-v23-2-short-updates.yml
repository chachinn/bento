;(()=>{const lib=window.BENTO_RECIPE_LIBRARY=Array.isArray(window.BENTO_RECIPE_LIBRARY)?window.BENTO_RECIPE_LIBRARY:[];const add=[
{id:'fil_164_pork_estofado',title:'Pork Estofado',localName:'Estofadong Baboy',cuisine:'Filipino',countryCode:'PH',region:'Philippines',category:'Main Dishes',prep:20,cook:55,servings:4,difficulty:'Medium',energy:'normal',cleanup:2,freezer:'yes',equipment:'wide skillet or Dutch oven',ingredients:['900 g pork shoulder, cut into 4 cm cubes','4 saba bananas, peeled and cut into thick slices','1 large carrot, cut into chunks','1 small onion, chopped','6 cloves garlic, minced','180 ml cane vinegar','120 ml soy sauce','240 ml water','3 tbsp brown sugar','2 Chinese sausages (lap cheong), sliced, optional','1/4 tsp ground black pepper','2 tbsp neutral cooking oil','steamed rice, for serving'],steps:['Pat the pork dry and prepare all vegetables before heating the pan so the braise can move without long pauses.','Heat the oil over medium heat. Brown the saba banana slices for about 2–3 minutes per side until lightly caramelized but still firm, then transfer them to a plate.','In the same pan, cook the onion for 2 minutes, add the garlic, and stir for about 30 seconds until fragrant.','Add the pork and sear for 6–8 minutes, turning occasionally, until several sides are browned.','Pour in the vinegar and let it boil uncovered without stirring for 2–3 minutes so the sharp raw acidity cooks off.','Add the soy sauce and water. Bring to a boil, lower to a gentle simmer, cover, and cook for 35–45 minutes until the pork is fork-tender; add a splash of water if the pan gets dry before the meat softens.','Stir in the brown sugar, black pepper, and carrot. Simmer uncovered for 5–7 minutes until the carrot is tender and the sauce begins to reduce.','Fold in the sliced Chinese sausage, if using, and the browned saba bananas. Simmer gently for another 3–5 minutes until everything is hot and the sauce coats the pork.','Taste and adjust only if needed, then rest for 5 minutes before serving with steamed rice.'],notes:'Sweet-savory Filipino pork estofado with saba bananas and carrots. Keep the bananas firm enough to hold their shape in the final braise.',source:'Reviewed Filipino classic based on Kawaling Pinoy and Panlasang Pinoy references.',sourceUrls:['https://www.kawalingpinoy.com/pork-estofado/','https://panlasangpinoy.com/pork-estofado-recipe/'],recipeType:'Reviewed classic',builtIn:true,favorite:false,libraryVersion:24,instructionVersion:24,instructionStyle:'comprehensive-variable-length',createdAt:'2026-08-13T23:49:00+08:00'},
{id:'jp_149_souffle_pancakes',title:'Japanese Soufflé Pancakes',japaneseName:'スフレパンケーキ',romanization:'sufure pankēki',cuisine:'Japanese',countryCode:'JP',region:'Japan',category:'Sweets & Desserts',dessertStyle:'Cakes & baked',prep:20,cook:20,servings:2,difficulty:'Medium',energy:'normal',cleanup:2,freezer:'no',equipment:'nonstick skillet with lid; hand mixer',ingredients:['2 large eggs, separated','30 ml whole milk','1/2 tsp vanilla extract','30 g cake flour','1/2 tsp baking powder','20 g granulated sugar','1/4 tsp cream of tartar or 1/2 tsp lemon juice','neutral oil, for the pan','2 tbsp water, for steaming','powdered sugar, berries, whipped cream or syrup, optional'],steps:['Separate the eggs while cold, then let the yolks sit briefly while you chill the whites for about 10 minutes; cold whites are easier to whip cleanly.','Whisk the yolks with the milk and vanilla until smooth. Sift in the cake flour and baking powder and whisk just until no dry flour remains.','Beat the egg whites until foamy, add the cream of tartar or lemon juice, then gradually add the sugar while beating to glossy stiff peaks that stand upright.','Fold about one-third of the meringue into the yolk batter to lighten it, then gently fold in the remaining meringue in two additions without crushing the air bubbles.','Warm a lightly oiled nonstick skillet over the lowest practical heat for 2–3 minutes. Spoon tall mounds of batter into the pan, stacking a little more batter on top of each mound.','Add about 1 tbsp water to an empty area of the pan, cover immediately, and cook on very low heat for 5–6 minutes until the bottoms are lightly golden and the tops look more set.','Carefully turn each pancake with a wide spatula. Add the remaining water, cover again, and cook for another 4–6 minutes until the centers feel springy rather than wet.','Turn off the heat and leave the pancakes covered for 1 minute, then uncover and transfer them gently to plates so they lose as little height as possible.','Serve immediately with powdered sugar, berries, whipped cream, or syrup.'],notes:'Japanese café-style pancakes get their height from a stable meringue and low, covered cooking. Avoid high heat, which browns the outside before the center sets.',source:'Reviewed Japanese café-style recipe informed by Just One Cookbook and King Arthur Baking methods.',sourceUrls:['https://www.justonecookbook.com/souffle-pancake/','https://www.kingarthurbaking.com/recipes/japanese-souffle-pancakes-recipe'],recipeType:'Reviewed classic',builtIn:true,favorite:false,libraryVersion:24,instructionVersion:24,instructionStyle:'comprehensive-variable-length',createdAt:'2026-08-13T23:50:00+08:00'}];for(const r of add)if(!lib.some(x=>x.id===r.id||x.title===r.title))lib.push(r)})();
