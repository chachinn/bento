name: Bento Japanese Filipino gap audit
on:
  push:
    branches: [bento-jp-ph-expansion-v25]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print Japanese and Filipino coverage
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const srcs=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(m=>m[1].split('?')[0]).filter(s=>s.startsWith('data/')&&s.endsWith('.js'));
          const c={console,URL,URLSearchParams,TextDecoder,TextEncoder,atob,btoa,Math,Date,Set,Map,WeakSet,WeakMap,Array,Object,String,Number,Boolean,RegExp,JSON,parseInt,parseFloat,isNaN,encodeURIComponent,decodeURIComponent};c.window=c;c.globalThis=c;vm.createContext(c);
          for(const f of srcs) vm.runInContext(fs.readFileSync(f,'utf8'),c,{filename:f,timeout:5000});
          const lib=c.BENTO_RECIPE_LIBRARY||[];
          for(const cuisine of ['Japanese','Filipino']){
            const rows=lib.filter(r=>r.cuisine===cuisine&&!r.animeSeries&&!r.gameSeries&&!r.gameDish);
            const cats={}; for(const r of rows) cats[r.category]=(cats[r.category]||0)+1;
            console.log(`\n=== ${cuisine} ${rows.length} ===`);
            console.log('CATEGORIES',JSON.stringify(cats));
            for(const r of rows.sort((a,b)=>a.title.localeCompare(b.title))) console.log(`${r.id}\t${r.title}\t${r.region||''}\t${r.category||''}`);
          }
          NODE
