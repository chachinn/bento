name: Build Bento Chinese and Thai method-depth review

on:
  push:
    branches: [bento-cn-thai-method-depth]
    paths:
      - '.github/workflows/cn-thai-method-depth-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean release from production main
        run: |
          set -euo pipefail
          git fetch origin main bento-thai-v24 bento-cn-thai-method-depth
          git checkout -B bento-v24-cn-thai-review origin/main

          for f in \
            data/thai-recipes-00.js \
            data/thai-recipes-01.js \
            data/thai-recipes-02.js \
            data/thai-recipes-03.js \
            data/thai-recipes-04.js \
            data/thai-recipes-05.js \
            data/thai-recipes-06.js \
            data/thai-extra-041-050.js \
            data/thai-extra-051-060.js \
            data/thai-runtime.js
          do
            git show "origin/bento-thai-v24:$f" > "$f"
          done

          git show "origin/bento-cn-thai-method-depth:data/cuisine-method-depth.js" > data/cuisine-method-depth.js

      - name: Wire method-depth and Thai library
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          app = Path('app.js')
          s = app.read_text()
          if 'const VERSION = 23;' not in s:
              raise SystemExit('unexpected app version')
          app.write_text(s.replace('const VERSION = 23;', 'const VERSION = 24;', 1))

          p = Path('data/chinese-meta-core.js')
          s = p.read_text()
          if "instructionVersion:23" not in s:
              raise SystemExit('unexpected Chinese instruction version')
          s = s.replace("instructionVersion:23", "instructionVersion:26", 1)
          p.write_text(s)

          p = Path('data/thai-runtime.js')
          s = p.read_text()
          if "instructionVersion:25" not in s:
              raise SystemExit('unexpected Thai instruction version')
          s = s.replace("instructionVersion:25", "instructionVersion:26", 1)
          s = s.replace("auditStatus:'Thai library reviewed · 2026'", "auditStatus:'Method depth reviewed · 2026'", 1)
          p.write_text(s)

          index = Path('index.html')
          s = index.read_text().replace('23p3', '24p1')
          cn_runtime = '  <script src="data/chinese-runtime.js?v=24p1" defer></script>'
          if cn_runtime not in s:
              raise SystemExit('Chinese runtime anchor missing')
          thai_rows = '\n'.join(
              [f'  <script src="data/thai-recipes-{i:02d}.js?v=24p1" defer></script>' for i in range(7)]
              + [
                  '  <script src="data/thai-extra-041-050.js?v=24p1" defer></script>',
                  '  <script src="data/thai-extra-051-060.js?v=24p1" defer></script>',
                  '  <script src="data/cuisine-method-depth.js?v=24p1" defer></script>',
              ]
          )
          s = s.replace(cn_runtime, thai_rows + '\n' + cn_runtime, 1)

          app_anchor = '  <script src="app.js?v=24p1" defer></script>'
          if app_anchor not in s:
              raise SystemExit('app script anchor missing')
          s = s.replace(app_anchor, '  <script src="data/thai-runtime.js?v=24p1" defer></script>\n' + app_anchor, 1)
          index.write_text(s)

          sw = Path('service-worker.js')
          s = sw.read_text()
          if "const CACHE='bento-shell-v0.9.2-v23p3';" not in s:
              raise SystemExit('unexpected cache version')
          s = s.replace("const CACHE='bento-shell-v0.9.2-v23p3';", "const CACHE='bento-shell-v1.0.0-v24p1';", 1)
          s = s.replace("const ASSET_VERSION='23p3';", "const ASSET_VERSION='24p1';", 1)
          s = s.replace('?v=23p3', '?v=24p1')

          cn_asset = "  './data/chinese-runtime.js?v=24p1',"
          if cn_asset not in s:
              raise SystemExit('Chinese SW anchor missing')
          thai_assets = '\n'.join(
              [f"  './data/thai-recipes-{i:02d}.js?v=24p1'," for i in range(7)]
              + [
                  "  './data/thai-extra-041-050.js?v=24p1',",
                  "  './data/thai-extra-051-060.js?v=24p1',",
                  "  './data/cuisine-method-depth.js?v=24p1',",
              ]
          )
          s = s.replace(cn_asset, thai_assets + '\n' + cn_asset, 1)

          app_asset = "  './app.js?v=24p1'"
          if app_asset not in s:
              raise SystemExit('app SW anchor missing')
          s = s.replace(app_asset, "  './data/thai-runtime.js?v=24p1',\n" + app_asset, 1)
          sw.write_text(s)

          p = Path('data/library_manifest.json')
          d = json.loads(p.read_text())
          d['libraryVersion'] = 26
          d['recipeCount'] = 1058
          d['newRecipesThisBuild'] = 60
          d['cuisineCount'] = 5
          d['verifiedCuisineLibraries'] = ['Japanese','Filipino','Korean','Chinese','Thai']
          d['standardRecipeCount'] = 587
          d['chineseRecipeCount'] = 40
          d['thaiRecipeCount'] = 60
          d['dishImageCount'] = 1058
          d['instructionVersion'] = 26
          d['instructionStyle'] = 'comprehensive-variable-length'
          d['detailedInstructionRecipeCount'] = 1058
          d['appRelease'] = '24.0'
          d['cacheFix'] = 'v24.0 uses the 24p1 shell generation and caches the Chinese/Thai method-depth layer plus the reviewed Thai library.'
          d['generatedAt'] = '2026-08-14T10:05:00+08:00'
          d['qualityGate'] = 'Chinese and Thai methods are reviewed against the variable-length v22.2 standard. Simple dishes stay concise; complex dishes retain every meaningful preparation, cooking, doneness, resting and finishing stage. No maximum step count is imposed.'
          d['qualityAuditSnapshot']['fullLibrary'] = {
              'recipeCount': 1058,
              'uniqueRecipeIds': 1058,
              'criticalStructureFailures': 0
          }
          d['qualityAuditSnapshot']['standardCuisines'] = {
              'recipeCount': 587,
              'Japanese': 149,
              'Filipino': 164,
              'Korean': 174,
              'Chinese': 40,
              'Thai': 60,
              'flaggedRecipes': 0
          }
          d['qualityAuditSnapshot']['methodDepth'] = {
              'policy': 'No fixed step count. The recipe itself determines the number of numbered steps.',
              'benchmark': 'Japanese, Filipino and Korean method-depth review from v22.2',
              'Chinese': {
                  'recipesReviewed': 40,
                  'recipesRewritten': 40,
                  'complexRecipesAllowedPastFiveSteps': True
              },
              'Thai': {
                  'recipesReviewed': 60,
                  'recipesRewrittenForDepth': 40,
                  'alreadyDetailedExpansionRecipesReviewed': 20,
                  'complexRecipesAllowedPastFiveSteps': True
              }
          }
          d['qualityAuditSnapshot']['Chinese'] = {
              'recipeCount': 40,
              'uniqueRecipeIds': 40,
              'methodStructureFailures': 0,
              'methodPolicy': 'variable-length; no artificial maximum'
          }
          d['qualityAuditSnapshot']['Thai'] = {
              'recipeCount': 60,
              'uniqueRecipeIds': 60,
              'methodStructureFailures': 0,
              'methodPolicy': 'variable-length; no artificial maximum',
              'regionalCoverage': [
                  'Central Thailand',
                  'Northern Thailand',
                  'Isan/Northeastern Thailand',
                  'Southern Thailand'
              ]
          }
          d['chineseRelease'] = 'v24.0 re-reviews all 40 existing Chinese recipes for full cookable method depth while preserving stable IDs, Chinese names, pinyin, regions and search metadata.'
          d['thaiRelease'] = 'v24.0 adds 60 reviewed Thai recipes without a cuisine-size cap, spanning Central, Northern/Lanna, Isan/Northeastern and Southern Thai cooking, street food, breakfast, desserts and drinks.'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Syntax and full-library QA
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          for f in data/*.js; do node --check "$f"; done

          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.window=global;
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script src="([^"]+)"/g)]
            .map(m=>m[1].split('?')[0])
            .filter(x=>x.startsWith('data/')&&x.endsWith('.js'));

          const repeats=scripts.filter((x,i)=>scripts.indexOf(x)!==i);
          if(repeats.length) throw new Error('duplicate data script references: '+[...new Set(repeats)].join(', '));
          for(const f of scripts){
            if(!fs.existsSync(f)) throw new Error('missing indexed data file '+f);
            vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          }

          const rows=global.BENTO_RECIPE_LIBRARY||[];
          const ids=rows.map(r=>String(r?.id||''));
          if(rows.length!==1058) throw new Error(`expected 1058 recipes, got ${rows.length}`);
          if(new Set(ids).size!==1058) throw new Error('duplicate recipe IDs in full library');

          const chinese=rows.filter(r=>r.cuisine==='Chinese');
          const thai=rows.filter(r=>r.cuisine==='Thai');
          if(chinese.length!==40) throw new Error(`expected 40 Chinese recipes, got ${chinese.length}`);
          if(thai.length!==60) throw new Error(`expected 60 Thai recipes, got ${thai.length}`);

          const required=r=>r.id&&r.title&&r.localName&&r.romanization&&r.region&&
            Array.isArray(r.ingredients)&&r.ingredients.length>=2&&
            Array.isArray(r.steps)&&r.steps.length>=1;
          const bad=[...chinese,...thai].filter(r=>!required(r));
          if(bad.length) throw new Error('Chinese/Thai structure failures: '+bad.map(r=>r.id).join(', '));

          const dist=list=>{
            const d={}; for(const r of list)d[r.steps.length]=(d[r.steps.length]||0)+1; return d;
          };
          const cnMax=Math.max(...chinese.map(r=>r.steps.length));
          const thMax=Math.max(...thai.map(r=>r.steps.length));
          if(cnMax<=5) throw new Error('Chinese still has an artificial five-step ceiling');
          if(thMax<=5) throw new Error('Thai still has an artificial five-step ceiling');

          const byId=new Map(rows.map(r=>[r.id,r]));
          const minima={
            cn_001:9, cn_006:10, cn_011:12, cn_016:10, cn_018:11, cn_020:10, cn_026:11, cn_027:12,
            th_001:9, th_005:10, th_007:10, th_013:10, th_015:10, th_016:10, th_023:10, th_026:10, th_028:10, th_034:10
          };
          for(const [id,min] of Object.entries(minima)){
            const r=byId.get(id);
            if(!r) throw new Error('missing method-depth anchor '+id);
            if(r.steps.length<min) throw new Error(`${id} expected >=${min} steps, got ${r.steps.length}`);
          }

          if(global.BENTO_METHOD_DEPTH_VERSION!==26) throw new Error('method-depth layer did not execute');

          const methodKey=r=>r.steps.map(s=>String(s).trim().toLowerCase()).join(' || ');
          for(const [name,list] of [['Chinese',chinese],['Thai',thai]]){
            const groups=new Map();
            for(const r of list){
              const k=methodKey(r);
              if(!groups.has(k)) groups.set(k,[]);
              groups.get(k).push(r.id);
            }
            const dup=[...groups.values()].filter(g=>g.length>1);
            if(dup.length) throw new Error(`${name} exact duplicate method groups: ${JSON.stringify(dup)}`);
          }

          const timedRegex=/\b\d+(?:\s*[–-]\s*\d+)?\s*(?:seconds?|secs?|minutes?|mins?|hours?|hrs?)\b/i;
          const missingTiming=[...chinese,...thai].filter(r=>Number(r.cook||0)>=10&&!r.steps.some(s=>timedRegex.test(String(s))));
          if(missingTiming.length) throw new Error('missing explicit cooking timing: '+missingTiming.map(r=>r.id).join(', '));

          const thaiRegions=['Central','Northern','Isan','Southern'];
          for(const region of thaiRegions){
            if(!thai.some(r=>String(r.region||'').includes(region))) throw new Error('missing Thai regional coverage '+region);
          }

          const manifest=JSON.parse(fs.readFileSync('data/library_manifest.json','utf8'));
          if(manifest.recipeCount!==rows.length) throw new Error('manifest/full-library recipe count mismatch');
          if(manifest.standardRecipeCount!==587) throw new Error('unexpected manifest standard count');
          if(manifest.chineseRecipeCount!==40||manifest.thaiRecipeCount!==60) throw new Error('manifest cuisine count mismatch');

          console.log(JSON.stringify({
            fullLibrary:rows.length,
            uniqueIds:new Set(ids).size,
            Chinese:{count:chinese.length,distribution:dist(chinese),min:Math.min(...chinese.map(r=>r.steps.length)),max:cnMax},
            Thai:{count:thai.length,distribution:dist(thai),min:Math.min(...thai.map(r=>r.steps.length)),max:thMax},
            methodDepthVersion:global.BENTO_METHOD_DEPTH_VERSION
          },null,2));
          NODE

      - name: PWA and release-scope QA
        run: |
          set -euo pipefail
          grep -q "const VERSION = 24;" app.js
          grep -q "bento-shell-v1.0.0-v24p1" service-worker.js
          grep -q "cuisine-method-depth.js?v=24p1" index.html
          grep -q "thai-extra-051-060.js?v=24p1" index.html
          grep -q "thai-runtime.js?v=24p1" index.html
          grep -q "cuisine-method-depth.js?v=24p1" service-worker.js
          grep -q "thai-extra-051-060.js?v=24p1" service-worker.js
          grep -q "thai-runtime.js?v=24p1" service-worker.js
          test ! -e tmp/thai07.b64
          test ! -e tmp/thai10.b64
          git diff --check

          actual="$(git diff --name-only origin/main | sort | tr '\n' ' ')"
          expected="$(printf '%s\n' \
            app.js \
            data/chinese-meta-core.js \
            data/cuisine-method-depth.js \
            data/library_manifest.json \
            data/thai-extra-041-050.js \
            data/thai-extra-051-060.js \
            data/thai-recipes-00.js \
            data/thai-recipes-01.js \
            data/thai-recipes-02.js \
            data/thai-recipes-03.js \
            data/thai-recipes-04.js \
            data/thai-recipes-05.js \
            data/thai-recipes-06.js \
            data/thai-runtime.js \
            index.html \
            service-worker.js | sort | tr '\n' ' ')"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected release scope"
            echo "ACTUAL:   $actual"
            echo "EXPECTED: $expected"
            exit 1
          fi

      - name: Publish clean review branch
        run: |
          set -euo pipefail
          git config user.name 'chachinn'
          git config user.email '140357822+chachinn@users.noreply.github.com'
          git add \
            app.js index.html service-worker.js \
            data/library_manifest.json \
            data/chinese-meta-core.js \
            data/cuisine-method-depth.js \
            data/thai-runtime.js \
            data/thai-recipes-00.js \
            data/thai-recipes-01.js \
            data/thai-recipes-02.js \
            data/thai-recipes-03.js \
            data/thai-recipes-04.js \
            data/thai-recipes-05.js \
            data/thai-recipes-06.js \
            data/thai-extra-041-050.js \
            data/thai-extra-051-060.js
          git commit -m 'Bento v24: deepen Chinese and Thai cooking methods'
          git push origin HEAD:refs/heads/bento-v24-cn-thai-review --force
