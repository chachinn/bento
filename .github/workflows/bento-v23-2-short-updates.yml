name: Bento v23.2 short usability QA

on:
  push:
    branches: [bento-chinese-v23]
    paths:
      - '.github/workflows/bento-v23-2-short-updates.yml'

permissions:
  contents: write

jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Preserve patch files
        run: |
          mkdir -p /tmp/bento-v23-2
          cp .github/patch/v23p2-app-a.txt /tmp/bento-v23-2/app-a.py
          cp .github/patch/v23p2-plan.txt /tmp/bento-v23-2/plan.py
          cp .github/patch/v23p2-meal.txt /tmp/bento-v23-2/meal.py
          cp .github/patch/v23p2-serving.js.txt /tmp/bento-v23-2/serving.js
          cp .github/patch/v23p2-bulk.js.txt /tmp/bento-v23-2/bulk.js

      - name: Start from current production
        run: |
          git fetch origin main
          git checkout -B short-update origin/main

      - name: Apply app patches
        run: |
          python3 /tmp/bento-v23-2/app-a.py
          python3 /tmp/bento-v23-2/plan.py
          python3 /tmp/bento-v23-2/meal.py
          node /tmp/bento-v23-2/serving.js
          node /tmp/bento-v23-2/bulk.js

      - name: Update interface and cache generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8').replace('?v=23p2','?v=23p3')
          a='<label>Saved recipe<select id="mealRecipeSelect"><option value="">Choose a recipe…</option></select></label>';b='<label>Saved recipe<input id="mealRecipeSearchInput" type="search" placeholder="Type to search recipes…" autocomplete="off" /><select id="mealRecipeSelect"><option value="">Choose a recipe…</option></select><small class="muted">Search first, then choose from the filtered dropdown.</small></label>'
          if 'mealRecipeSearchInput' not in s:
              assert a in s;s=s.replace(a,b,1)
          a='<div class="action-row compact-actions"><button class="soft-btn" data-view-link="smart">🧊 Fridge Rescue</button><button class="soft-btn" id="addLowStockToGrocery">Low stock → Grocery</button></div>\n        <div id="pantryList" class="card-list"></div>';b='<div class="action-row compact-actions pantry-action-row"><button class="soft-btn" data-view-link="smart">🧊 Fridge Rescue</button><button class="soft-btn" id="addLowStockToGrocery">Low stock → Grocery</button><button class="soft-btn" id="pantrySelectButton">Select</button></div>\n        <div id="pantryBulkBar" class="bulk-action-bar hidden"><span id="pantrySelectedCount">0 selected</span><button class="soft-btn" id="pantrySelectAllButton">Select all</button><button class="soft-btn danger-soft" id="pantryDeleteSelectedButton">Delete</button></div>\n        <div id="pantryList" class="card-list"></div>'
          if 'pantryBulkBar' not in s:
              assert a in s;s=s.replace(a,b,1)
          a='<div class="action-row"><button class="soft-btn" id="groceryFromPlanButton">Generate from this week</button><button class="soft-btn" id="checkedToPantryButton">Checked → Pantry</button><button class="soft-btn" id="clearCheckedButton">Clear checked</button><button class="soft-btn" id="shareGroceryButton">Share</button></div>';b='<div class="action-row grocery-actions"><button class="soft-btn" id="groceryFromPlanButton">From plan</button><button class="soft-btn" id="checkedToPantryButton">To Pantry</button><button class="soft-btn" id="groceryCheckAllButton">Check all</button><button class="soft-btn" id="groceryUncheckAllButton">Uncheck</button><button class="soft-btn danger-soft" id="clearCheckedButton">Delete checked</button><button class="soft-btn" id="shareGroceryButton">Share</button></div>'
          if 'groceryCheckAllButton' not in s:
              assert a in s;s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')
          sw=Path('service-worker.js');x=sw.read_text(encoding='utf-8');x=x.replace("const CACHE='bento-shell-v0.9.1-v23p2';","const CACHE='bento-shell-v0.9.2-v23p3';",1).replace("const ASSET_VERSION='23p2';","const ASSET_VERSION='23p3';",1).replace('?v=23p2','?v=23p3');sw.write_text(x,encoding='utf-8')
          PY
          cat >> style.css <<'CSS'

          /* Bento v23.2 short usability polish */
          .game-region-heading{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 6px;color:var(--muted);font-size:12px;font-weight:800}.game-region-heading .text-btn{font-size:12px;padding:5px 8px}
          .plan-week-summary{margin:2px 0 14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--surface),var(--surface2))}.plan-summary-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:9px}.plan-summary-head h3{margin:2px 0 0}.plan-summary-list{display:grid;gap:7px}.plan-summary-recipe{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text)}.plan-summary-recipe span:nth-child(2){display:grid;gap:2px}.plan-summary-recipe small{color:var(--muted);font-size:11px}.plan-summary-recipe i{font-style:normal;color:var(--accent-strong)}
          .plan-slot.filled{display:grid;grid-template-columns:86px minmax(0,1fr) 38px;align-items:center;gap:5px;padding:4px 0;border-bottom:1px solid var(--line)}.plan-slot.filled>span{text-transform:uppercase;color:var(--accent-strong);font-size:11px;font-weight:900;letter-spacing:.04em}.plan-slot-recipe{min-width:0;text-align:left;border:0;background:transparent;color:var(--text);padding:8px 4px;display:grid;gap:2px}.plan-slot-recipe b{white-space:normal}.plan-slot-recipe small{font-size:11px;color:var(--muted)}.plan-slot-edit{width:34px;height:34px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--accent-strong);font-weight:900}.plan-slot.empty{width:100%}
          #mealRecipeSearchInput{margin-bottom:8px}.compact-dialog #mealRecipeSelect{margin-top:0}.grocery-actions,.pantry-action-row{gap:7px!important;flex-wrap:wrap}.grocery-actions .soft-btn,.pantry-action-row .soft-btn,.bulk-action-bar .soft-btn{min-height:36px!important;padding:8px 11px!important;border-radius:12px!important;font-size:12px!important;flex:0 1 auto!important}.danger-soft{color:#b64f5f!important;background:#fff4f5!important}.bulk-action-bar{display:flex;align-items:center;gap:7px;margin:8px 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}.bulk-action-bar.hidden{display:none}.bulk-action-bar>span{margin-right:auto;color:var(--muted);font-size:12px;font-weight:800}.pantry-select-card{display:grid!important;grid-template-columns:28px 56px minmax(0,1fr)!important;align-items:center!important;cursor:pointer}.pantry-select-card>input{width:21px;height:21px;accent-color:var(--accent)}.pantry-select-card.selected{border-color:var(--accent)!important;background:var(--surface2)!important}
          @media(max-width:520px){.plan-slot.filled{grid-template-columns:76px minmax(0,1fr) 34px}.grocery-actions .soft-btn,.pantry-action-row .soft-btn{font-size:11.5px!important;padding:7px 9px!important}.grocery-item{grid-template-columns:34px 76px minmax(0,1fr) 28px!important;gap:7px!important}.grocery-item .ingredient-thumb-xs{width:72px!important;height:48px!important}.plan-week-summary{padding:12px}.plan-summary-recipe{padding:8px 9px}}
          CSS

      - name: Add requested recipes
        run: |
          cat >> data/recipes-data.js <<'JS'
          ;(()=>{const lib=window.BENTO_RECIPE_LIBRARY=Array.isArray(window.BENTO_RECIPE_LIBRARY)?window.BENTO_RECIPE_LIBRARY:[];const add=[
          {id:'fil_164_pork_estofado',title:'Pork Estofado',localName:'Estofadong Baboy',cuisine:'Filipino',countryCode:'PH',region:'Philippines',category:'Main Dishes',prep:20,cook:55,servings:4,difficulty:'Medium',energy:'normal',cleanup:2,freezer:'yes',equipment:'wide skillet or Dutch oven',ingredients:['900 g pork shoulder, cut into 4 cm cubes','4 saba bananas, peeled and cut into thick slices','1 large carrot, cut into chunks','1 small onion, chopped','6 cloves garlic, minced','180 ml cane vinegar','120 ml soy sauce','240 ml water','3 tbsp brown sugar','2 Chinese sausages (lap cheong), sliced, optional','1/4 tsp ground black pepper','2 tbsp neutral cooking oil','steamed rice, for serving'],steps:['Pat the pork dry and prepare all vegetables before heating the pan.','Heat the oil over medium heat. Brown the saba banana slices for about 2–3 minutes per side until lightly caramelized but still firm, then transfer them to a plate.','In the same pan, cook the onion for 2 minutes, add the garlic, and stir for about 30 seconds until fragrant.','Add the pork and sear for 6–8 minutes, turning occasionally, until several sides are browned.','Pour in the vinegar and let it boil uncovered without stirring for 2–3 minutes so the sharp raw acidity cooks off.','Add the soy sauce and water. Bring to a boil, lower to a gentle simmer, cover, and cook for 35–45 minutes until the pork is fork-tender.','Stir in the brown sugar, black pepper, and carrot. Simmer uncovered for 5–7 minutes until the carrot is tender and the sauce begins to reduce.','Fold in the sliced Chinese sausage, if using, and the browned saba bananas. Simmer gently for another 3–5 minutes until everything is hot and the sauce coats the pork.','Rest for 5 minutes before serving with steamed rice.'],notes:'Sweet-savory Filipino pork estofado with saba bananas and carrots.',source:'Reviewed Filipino classic based on Kawaling Pinoy and Panlasang Pinoy references.',sourceUrls:['https://www.kawalingpinoy.com/pork-estofado/','https://panlasangpinoy.com/pork-estofado-recipe/'],recipeType:'Reviewed classic',builtIn:true,favorite:false,libraryVersion:24,instructionVersion:24,instructionStyle:'comprehensive-variable-length',createdAt:'2026-08-13T23:49:00+08:00'},
          {id:'jp_149_souffle_pancakes',title:'Japanese Soufflé Pancakes',japaneseName:'スフレパンケーキ',romanization:'sufure pankēki',cuisine:'Japanese',countryCode:'JP',region:'Japan',category:'Sweets & Desserts',dessertStyle:'Cakes & baked',prep:20,cook:20,servings:2,difficulty:'Medium',energy:'normal',cleanup:2,freezer:'no',equipment:'nonstick skillet with lid; hand mixer',ingredients:['2 large eggs, separated','30 ml whole milk','1/2 tsp vanilla extract','30 g cake flour','1/2 tsp baking powder','20 g granulated sugar','1/4 tsp cream of tartar or 1/2 tsp lemon juice','neutral oil, for the pan','2 tbsp water, for steaming','powdered sugar, berries, whipped cream or syrup, optional'],steps:['Separate the eggs while cold, then chill the whites for about 10 minutes.','Whisk the yolks with the milk and vanilla until smooth. Sift in the cake flour and baking powder and whisk just until no dry flour remains.','Beat the egg whites until foamy, add the cream of tartar or lemon juice, then gradually add the sugar while beating to glossy stiff peaks.','Fold one-third of the meringue into the yolk batter, then gently fold in the remaining meringue in two additions without crushing the air bubbles.','Warm a lightly oiled nonstick skillet over very low heat for 2–3 minutes. Spoon tall mounds of batter into the pan.','Add about 1 tbsp water to an empty area of the pan, cover immediately, and cook on very low heat for 5–6 minutes until the bottoms are lightly golden and the tops look more set.','Carefully turn each pancake with a wide spatula. Add the remaining water, cover again, and cook for another 4–6 minutes until the centers feel springy rather than wet.','Turn off the heat and leave the pancakes covered for 1 minute, then transfer them gently to plates.','Serve immediately with powdered sugar, berries, whipped cream, or syrup.'],notes:'Japanese café-style pancakes get their height from a stable meringue and low, covered cooking.',source:'Reviewed Japanese café-style recipe informed by Just One Cookbook and King Arthur Baking methods.',sourceUrls:['https://www.justonecookbook.com/souffle-pancake/','https://www.kingarthurbaking.com/recipes/japanese-souffle-pancakes-recipe'],recipeType:'Reviewed classic',builtIn:true,favorite:false,libraryVersion:24,instructionVersion:24,instructionStyle:'comprehensive-variable-length',createdAt:'2026-08-13T23:50:00+08:00'}];for(const r of add)if(!lib.some(x=>x.id===r.id||x.title===r.title))lib.push(r)})();
          JS

      - name: Update library manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('data/library_manifest.json');d=json.loads(p.read_text(encoding='utf-8'));d.update({'libraryVersion':24,'recipeCount':998,'newRecipesThisBuild':2,'standardRecipeCount':527,'japaneseRecipeCount':149,'filipinoRecipeCount':164,'dishImageCount':998,'instructionVersion':24,'detailedInstructionRecipeCount':998,'appRelease':'23.2','generatedAt':'2026-08-13T23:50:00+08:00','cacheFix':'v23.2 uses the 23p3 shell generation for the short usability release.','shortUpdateRelease':'v23.2 adds Pork Estofado and Japanese Soufflé Pancakes; fixes the top search action; adds collapsible Genshin regions; prefers source-world visuals for Genshin and Anime with real-food fallback; makes planned recipes directly openable with planned serving counts; adds searchable meal selection; and adds compact bulk grocery/pantry controls.'});q=d.setdefault('qualityAuditSnapshot',{});q['fullLibrary']={'recipeCount':998,'uniqueRecipeIds':998,'criticalStructureFailures':0};q['standardCuisines']={'recipeCount':527,'Japanese':149,'Filipino':164,'Korean':174,'Chinese':40,'flaggedRecipes':0};p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Syntax and full-library QA
        run: |
          node --check app.js
          node --check service-worker.js
          node --check data/recipes-data.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');global.window=global;const L=f=>vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});L('data/recipes-data.js');L('data/photo-index.js');L('data/korean-runtime.js');for(const f of fs.readdirSync('data').filter(x=>/^korean-recipes-\d+\.js$/.test(x)).sort())L('data/'+f);L('data/anime-runtime.js');for(const f of fs.readdirSync('data').filter(x=>/^anime-recipes-\d+\.js$/.test(x)).sort())L('data/'+f);L('data/chinese-init.js');for(let i=1;i<=40;i++)L(`data/chinese-recipes-${String(i).padStart(3,'0')}.js`);for(const f of ['chinese-runtime.js','chinese-meta-core.js','chinese-meta-extra.js','chinese-photo.js'])L('data/'+f);const all=window.BENTO_RECIPE_LIBRARY||[],ids=new Set(all.map(r=>r.id)),est=all.find(r=>r.id==='fil_164_pork_estofado'),sou=all.find(r=>r.id==='jp_149_souffle_pancakes'),ok=(v,m)=>{if(!v)throw Error(m)};ok(all.length===998,`recipe count ${all.length}`);ok(ids.size===998,`unique IDs ${ids.size}`);ok(est&&est.cuisine==='Filipino'&&est.steps.length>=8,'Pork Estofado incomplete');ok(sou&&sou.cuisine==='Japanese'&&sou.japaneseName&&sou.steps.length>=8,'Souffle pancakes incomplete');const app=fs.readFileSync('app.js','utf8'),index=fs.readFileSync('index.html','utf8'),sw=fs.readFileSync('service-worker.js','utf8');for(const marker of ['genshinArtworkSearch','animeArtworkSearch','data-game-collapse','plan-week-summary','data-recipe-serving','mealRecipeOptions','pantrySelectionMode','pantrySelectAllButton','groceryCheckAllButton','addRecipeIngredientsToGrocery(r,false,recipeDetailServingTarget)'])ok(app.includes(marker)||index.includes(marker),`missing ${marker}`);ok(index.includes('style.css?v=23p3')&&index.includes('app.js?v=23p3'),'index generation wrong');ok(sw.includes("bento-shell-v0.9.2-v23p3")&&sw.includes("ASSET_VERSION='23p3'"),'service-worker generation wrong');const m=JSON.parse(fs.readFileSync('data/library_manifest.json','utf8'));ok(m.recipeCount===998&&m.japaneseRecipeCount===149&&m.filipinoRecipeCount===164&&m.appRelease==='23.2','manifest wrong');console.log('Bento v23.2 QA passed',all.length,ids.size);
          NODE

      - name: Diff QA and publish review
        run: |
          git diff --check
          changed=$(git status --short | awk '{print $2}' | sort)
          allowed=$(printf '%s\n' app.js data/library_manifest.json data/recipes-data.js index.html service-worker.js style.css | sort)
          printf '%s\n' "$changed"
          test "$changed" = "$allowed"
          git config user.name 'chachinn'
          git config user.email '140357822+chachinn@users.noreply.github.com'
          git add app.js index.html style.css service-worker.js data/recipes-data.js data/library_manifest.json
          git commit -m 'Bento v23.2: planner, grocery and recipe usability polish'
          git push origin HEAD:refs/heads/bento-v23-2-review --force
