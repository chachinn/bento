name: Bento source consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bento-consolidate.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate Bento
        run: python3 tools/consolidate_bento.py

      - name: Validate JavaScript and diff
        run: |
          node --check app.js
          node --check service-worker.js
          git diff --check

      - name: Commit consolidated source
        run: |
          git config user.name "chachinn"
          git config user.email "140357822+chachinn@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Bento v21: consolidate core files and restore Anime categories [skip ci]"
          git push origin HEAD:main
