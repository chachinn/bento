name: Bento production photo and cuisine UI fix

on:
  push:
    branches: [bento-qa-aug13]
    paths:
      - '.github/workflows/bento-production-photo-ui-fix.yml'

permissions:
  contents: write

jobs:
  qa-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve reviewed patch and switch to current main
        shell: bash
        run: |
          set -euo pipefail
          cp tools/bento_photo_ui_patch.py /tmp/bento_photo_ui_patch.py
          git fetch origin main
          git checkout -B main origin/main

      - name: Apply reviewed fixes and structural QA
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/bento_photo_ui_patch.py

      - name: Syntax and diff QA
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          for f in data/*.js; do node --check "$f"; done
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool data/library_manifest.json >/dev/null
          git diff --check

      - name: Commit only after every QA gate passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chachinn'
          git config user.email '140357822+chachinn@users.noreply.github.com'
          git add app.js style.css service-worker.js
          git diff --cached --check
          git commit -m 'Bento v21.2: fix cuisine UI and recipe card photos [skip ci]'
          git push origin HEAD:main
