name: Bento Chinese QA
on: push
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/qa-cn.js
      - run: node tools/qa-assets.js
      - run: node --check service-worker.js
      - run: git diff --check
      - run: |
          rm -f .github/workflows/chinese-qa.yml tools/qa-cn.js tools/qa-assets.js
          rmdir .github/workflows .github tools 2>/dev/null || true
          git config user.name chachinn
          git config user.email 140357822+chachinn@users.noreply.github.com
          git add -A
          git commit -m 'Bento v23: clean production release'
          git push
