name: Finalize Bento Filipino v31.3

on:
  push:
    branches: [bento-v31-3-filipino-depth]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bento-v31-3-filipino-depth

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm branch is based on latest main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "Current main is not an ancestor of this branch. Refusing to finalize a stale release."
            exit 1
          }

      - name: Run pre-integration Filipino QA
        run: |
          for f in \
            data/filipino-extra-185-192.js \
            data/filipino-extra-193-200.js \
            data/filipino-extra-201-208.js \
            data/filipino-extra-209-216.js \
            data/filipino-extra-217-224.js \
            data/filipino-extra-225-232.js \
            data/filipino-extra-233-240.js \
            data/filipino-extra-241-248.js; do
            node --check "$f"
          done
          node scripts/audit-filipino-coverage.mjs
          node scripts/qa-filipino-depth.mjs
          node scripts/qa-filipino-runtime.mjs
          cp scripts/qa-filipino-runtime.mjs /tmp/qa-filipino-runtime.mjs

      - name: Integrate Filipino modules and release metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const additions = [
            'data/filipino-extra-185-192.js',
            'data/filipino-extra-193-200.js',
            'data/filipino-extra-201-208.js',
            'data/filipino-extra-209-216.js',
            'data/filipino-extra-217-224.js',
            'data/filipino-extra-225-232.js',
            'data/filipino-extra-233-240.js',
            'data/filipino-extra-241-248.js'
          ];
          const assetVersion = '31f1';

          let index = fs.readFileSync('index.html', 'utf8');
          const indexAnchor = '  <script src="data/filipino-extra-165-184.js?v=28p3" defer></script>\n';
          if (!index.includes(indexAnchor)) throw new Error('Filipino index anchor missing');
          if (!index.includes(additions[0])) {
            const tags = additions.map(f => `  <script src="${f}?v=${assetVersion}" defer></script>\n`).join('');
            index = index.replace(indexAnchor, indexAnchor + tags);
          }
          for (const f of additions) {
            const expected = `<script src="${f}?v=${assetVersion}" defer></script>`;
            if (!index.includes(expected)) throw new Error(`index integration missing ${f}`);
          }
          fs.writeFileSync('index.html', index);

          let sw = fs.readFileSync('service-worker.js', 'utf8');
          sw = sw.replace("const CACHE='bento-shell-v1.0.0-v31j2';", "const CACHE='bento-shell-v1.0.0-v31f1';");
          if (!sw.includes("const CACHE='bento-shell-v1.0.0-v31f1';")) throw new Error('service-worker cache generation replacement failed');
          if (sw.includes("const ASSET_VERSIONS=new Set(['28p3','29p1','30p1','31p1','31j1','31j2']);")) {
            sw = sw.replace(
              "const ASSET_VERSIONS=new Set(['28p3','29p1','30p1','31p1','31j1','31j2']);",
              "const ASSET_VERSIONS=new Set(['28p3','29p1','30p1','31p1','31j1','31j2','31f1']);"
            );
          } else if (!sw.includes("'31f1'")) {
            throw new Error('service-worker asset version set shape changed unexpectedly');
          }
          const swAnchor = "  './data/filipino-extra-165-184.js?v=28p3',\n";
          if (!sw.includes(swAnchor)) throw new Error('Filipino service-worker anchor missing');
          if (!sw.includes(`./${additions[0]}?v=${assetVersion}`)) {
            const assets = additions.map(f => `  './${f}?v=${assetVersion}',\n`).join('');
            sw = sw.replace(swAnchor, swAnchor + assets);
          }
          for (const f of additions) {
            if (!sw.includes(`'./${f}?v=${assetVersion}'`)) throw new Error(`service-worker integration missing ${f}`);
          }
          fs.writeFileSync('service-worker.js', sw);

          const manifestPath = 'data/library_manifest.json';
          const m = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          m.libraryVersion = 38;
          m.recipeCount = 2181;
          m.newRecipesThisBuild = 64;
          m.standardRecipeCount = 1710;
          m.japaneseRecipeCount = 252;
          m.filipinoRecipeCount = 248;
          m.dishImageCount = 2181;
          m.instructionVersion = 38;
          m.detailedInstructionRecipeCount = 2181;
          m.cacheFix = 'v31.3 adds 64 source-reviewed Filipino regional-depth recipes under the 31f1 shell generation while preserving the complete v31.2 Japanese library and all prior assets.';
          m.generatedAt = new Date().toISOString();
          m.appRelease = '31.3';
          if (!m.qualityAuditSnapshot || !m.qualityAuditSnapshot.fullLibrary || !m.qualityAuditSnapshot.standardCuisines || !m.qualityAuditSnapshot.PWA) {
            throw new Error('manifest quality snapshot shape changed unexpectedly');
          }
          m.qualityAuditSnapshot.fullLibrary.recipeCount = 2181;
          m.qualityAuditSnapshot.fullLibrary.uniqueRecipeIds = 2181;
          m.qualityAuditSnapshot.fullLibrary.criticalStructureFailures = 0;
          m.qualityAuditSnapshot.fullLibrary.releaseGate = 'pass';
          m.qualityAuditSnapshot.standardCuisines.recipeCount = 1710;
          m.qualityAuditSnapshot.standardCuisines.Japanese = 252;
          m.qualityAuditSnapshot.standardCuisines.Filipino = 248;
          m.qualityAuditSnapshot.standardCuisines.hierarchy = 'Japanese 252 > Filipino 248 > Spanish 215 > French 175 > Korean 174 > Indian 171 > Italian 165 > Vietnamese 130 > Chinese 90 = Thai 90';
          m.qualityAuditSnapshot.standardCuisines.flaggedRecipes = 0;
          m.qualityAuditSnapshot.standardCuisines.allergenFailures = 0;
          m.qualityAuditSnapshot.standardCuisines.referenceFailures = 0;
          m.qualityAuditSnapshot.standardCuisines.equipmentFailures = 0;
          m.qualityAuditSnapshot.standardCuisines.photoMetadataFailures = 0;
          m.qualityAuditSnapshot.PWA.assetVersion = assetVersion;
          m.qualityAuditSnapshot.v31_3FilipinoDepth = {
            auditedAt: new Date().toISOString().slice(0, 10),
            FilipinoAdded: 64,
            FilipinoTotal: 248,
            JapanesePreserved: 252,
            totalRecipeRecords: 2181,
            uniqueRecipeIds: 2181,
            standardRecipeCount: 1710,
            moduleCount: 8,
            firstId: 'ph_185',
            lastId: 'ph_248',
            coveragePolicy: 'Coverage-driven regional depth; no artificial recipe-count or method-step target.',
            runtimeRegression: 'passed',
            pwaAssetVersion: assetVersion
          };
          fs.writeFileSync(manifestPath, JSON.stringify(m, null, 2) + '\n');
          NODE

      - name: Run integrated release QA
        run: |
          node scripts/qa-filipino-depth.mjs
          node scripts/qa-filipino-runtime.mjs
          node <<'NODE'
          const fs=require('fs');
          const additions=[
            'data/filipino-extra-185-192.js','data/filipino-extra-193-200.js','data/filipino-extra-201-208.js','data/filipino-extra-209-216.js',
            'data/filipino-extra-217-224.js','data/filipino-extra-225-232.js','data/filipino-extra-233-240.js','data/filipino-extra-241-248.js'
          ];
          const index=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          const manifest=JSON.parse(fs.readFileSync('data/library_manifest.json','utf8'));
          for(const f of additions){
            if(!index.includes(`${f}?v=31f1`))throw new Error(`index missing ${f}`);
            if(!sw.includes(`./${f}?v=31f1`))throw new Error(`service worker missing ${f}`);
          }
          if(!sw.includes("const CACHE='bento-shell-v1.0.0-v31f1';"))throw new Error('wrong shell cache');
          for(const [k,v] of Object.entries({libraryVersion:38,recipeCount:2181,newRecipesThisBuild:64,standardRecipeCount:1710,japaneseRecipeCount:252,filipinoRecipeCount:248,instructionVersion:38,detailedInstructionRecipeCount:2181})){
            if(manifest[k]!==v)throw new Error(`manifest ${k}: expected ${v}, got ${manifest[k]}`);
          }
          if(manifest.appRelease!=='31.3')throw new Error('manifest release is not 31.3');
          if(manifest.qualityAuditSnapshot.PWA.assetVersion!=='31f1')throw new Error('manifest PWA asset version is not 31f1');
          console.log('Integrated PWA/manifest assertions: PASS');
          NODE

      - name: Remove temporary QA scaffolding
        run: |
          rm -f \
            .github/workflows/audit-filipino-inventory.yml \
            .github/workflows/finalize-filipino-v31-3.yml \
            README.tmp \
            scripts/audit-filipino-coverage.mjs \
            scripts/audit-filipino-inventory.mjs \
            scripts/qa-filipino-depth.mjs \
            scripts/qa-filipino-runtime.mjs

      - name: Re-run final committed-state runtime gate after cleanup
        run: |
          for f in \
            data/filipino-extra-185-192.js \
            data/filipino-extra-193-200.js \
            data/filipino-extra-201-208.js \
            data/filipino-extra-209-216.js \
            data/filipino-extra-217-224.js \
            data/filipino-extra-225-232.js \
            data/filipino-extra-233-240.js \
            data/filipino-extra-241-248.js; do
            node --check "$f"
          done
          node /tmp/qa-filipino-runtime.mjs
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          const manifest=JSON.parse(fs.readFileSync('data/library_manifest.json','utf8'));
          if((index.match(/filipino-extra-18[5-9]|filipino-extra-19[0-9]|filipino-extra-2[0-4][0-9]/g)||[]).length<8)throw new Error('Filipino script integration count too low');
          if(!sw.includes('31f1'))throw new Error('31f1 missing from service worker');
          if(manifest.recipeCount!==2181 || manifest.filipinoRecipeCount!==248)throw new Error('manifest final counts mismatch');
          console.log('Final committed-state release gate: PASS');
          NODE

      - name: Commit clean release candidate
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html service-worker.js data/library_manifest.json
          git add -u -- \
            .github/workflows/audit-filipino-inventory.yml \
            .github/workflows/finalize-filipino-v31-3.yml \
            README.tmp \
            scripts/audit-filipino-coverage.mjs \
            scripts/audit-filipino-inventory.mjs \
            scripts/qa-filipino-depth.mjs \
            scripts/qa-filipino-runtime.mjs
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Finalize Bento v31.3 Filipino regional depth"
          git push origin HEAD:bento-v31-3-filipino-depth
