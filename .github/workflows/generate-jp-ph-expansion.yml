name: Generate Japanese Filipino expansion
on:
  push:
    branches: [bento-jp-ph-expansion-v25]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bento-jp-ph-expansion-v25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and verify authored modules
        run: |
          python - <<'PY'
          import base64,bz2,glob,hashlib,json,os
          chunk_hashes=[
          '712d8ae2d23239d0bf0467bbe01ee5e9c7a389a0d4c784d39ac23d4c3665d460',
          '1ce03c9da29c9df9ba87c60c36c6c51316a3132e59d7d633936172752c50c1a7',
          'd812ee5d53a71bb4dd09f5c9cad496603b486a7ac02352259a5588b6944fcf1f',
          '9a61cf1f8361d172eb8406066c933d9dd3f1751f47257d2115edc1c90de3812a',
          '3fdde6d25341dfa8326fd89923d945210e2d143d31e10fbf02dbc18047951dcc',
          '63bd86e0ab455f147ff21fa5def3463bc9cd81ab736b1278259c458c0ab18cdd',
          '750ef47b3138bb016eb3020b8347aff1f4fedbda15d37ce3a7389e7b7439458f',
          '6ba389212416d1c1a05d6326482ee706b9a41d6a6875287a246a7f4c9db57a73',
          '6b83bb9d3e37ed9fd68f7c4556c31a0613f220db66800091f72622dc1c389426',
          'e4bf03fe925658c059689c1319c7d659c1edbaf79ba46a3640f8e0e4f6a28401',
          '11090d5ee5fefe95d669f6203669b27c4d40aeb8533d9a6b3c75b5b147c78da8',
          '51cdee9ad8bf80d559eafb31d4d30899612cffd190dc3bd96a689471f349d82a',
          '1104230420ca4215f620703ddd5eb1f36f879b393fed5f5fd36bbb57bbbac264',
          '6d7016072e646d1736ea7c5bbafafc809df355dd442aa599e403036a1030425c',
          '3a9b23e8625c17d0ea36a07f1ec33895e230d3aa601b09e988d9bc3a6c1f16e8',
          '0be7956304387058abc97409c4cd047048ee6951ad2d4312af872094ad17047a',
          'bd7b77c4e7b817577f0f0d10d8a99af22bf01751048bdbe4d1aaeae1c36f0868',
          '96507cb94dffd4253be6cd1d31e8233e607a593aa3b7e031a07d0baba361c504',
          'fe12abc569723f8be1b7edac59fe3ead3fffc1efd604f9e87af40085543f133b']
          files=sorted(glob.glob('tmp/jpph-bz-*.txt'))
          if len(files)!=19: raise SystemExit(f'Expected 19 verified chunks, got {len(files)}: {files}')
          chunks=[]
          for i,(fn,want) in enumerate(zip(files,chunk_hashes)):
            data=open(fn,encoding='utf-8').read().strip()
            expected_len=788 if i==18 else 2000
            if len(data)!=expected_len: raise SystemExit(f'Chunk {i} length {len(data)} != {expected_len}')
            got=hashlib.sha256(data.encode()).hexdigest()
            if got!=want: raise SystemExit(f'Chunk {i} hash {got} != {want}')
            chunks.append(data)
            print('CHUNK PASS',i,got)
          compressed=base64.b64decode(''.join(chunks),validate=True)
          got_archive=hashlib.sha256(compressed).hexdigest()
          want_archive='047cdcf16c31ea2bda7d4e473ae78cd5dd8be774ce279289e89aecdee6bee3ab'
          if got_archive!=want_archive: raise SystemExit(f'Archive hash {got_archive} != {want_archive}')
          payload=json.loads(bz2.decompress(compressed).decode('utf-8'))
          expected={
          'data/japanese-extra-150-154.js':'4d8c4e37bd323a1fb34488e6116e2968ca22288e67b0fc4ceb921926a84c8c90',
          'data/japanese-extra-155-159.js':'8cf2929fabb7af4cf1086d7fc3d7b0ece363f5cc4fc9d7662b9d57f0d81948fd',
          'data/japanese-extra-160-164.js':'5dc46324aabea72174f4a593dad8329659093f5eae19eaf6347abe1e313e3f43',
          'data/japanese-extra-165-169.js':'f0e73138d78a9f4cbc862cecb889ab820e357a3729a1c3813ce9ba55c10ca02e',
          'data/japanese-extra-170-174.js':'4d1b29940a94581f2446f2032b07bd83dad5684d77cad20cacfcf0fa2c396df6',
          'data/japanese-extra-175-179.js':'59aeac23623d2713a4e8659601f928103388c31186e4d7d822efe06cba95d596',
          'data/japanese-extra-180-184.js':'944ef627ff411150431c43374af207db49ae67f5732f6c64616bb87393776c45',
          'data/japanese-extra-185-189.js':'24f77708b6a18f33601c1a8c1b0680d08c72cb5ff9fb7c407f98d3211d6bcf93',
          'data/filipino-extra-165-169.js':'d2dcf6f2ff2e212723dfc7276ac15a72ba64ffa10c455f64f45cbc9b7027f405',
          'data/filipino-extra-170-174.js':'032b2cbbaf9d0128f6fdc2ab46233670f88fb28ad3b70e48f84b79a549c8d95a',
          'data/filipino-extra-175-179.js':'e78da8aa5946d2372be3c295f314551008eba17d10addd04b366e520ca658cd6',
          'data/filipino-extra-180-184.js':'3a078399b8c0ccc33fdbc5558507fc3c8da1b772b752c2b82978404e57b9cfa2'}
          expected_payload=set(expected)-{'data/japanese-extra-150-154.js'}
          if set(payload)!=expected_payload: raise SystemExit(f'Payload paths mismatch: {sorted(payload)}')
          for path,text in payload.items():
            os.makedirs(os.path.dirname(path),exist_ok=True)
            open(path,'w',encoding='utf-8',newline='').write(text)
          for path,want in expected.items():
            got=hashlib.sha256(open(path,'rb').read()).hexdigest()
            if got!=want: raise SystemExit(f'Module hash mismatch {path}: {got} != {want}')
            print('MODULE PASS',path,got)
          for pattern in ['tmp/jpph-bz-*.txt','tmp/jpph-archive-*.txt','tmp/jp-ph-payload-*.json']:
            for fn in glob.glob(pattern): os.remove(fn)
          os.remove('.github/workflows/generate-jp-ph-expansion.yml')
          PY
      - name: Syntax check all new recipe modules
        run: |
          for f in data/japanese-extra-*.js data/filipino-extra-*.js; do node --check "$f"; done
      - name: Commit verified readable recipe modules and cleanup
        run: |
          git config user.name "chachinn"
          git config user.email "140357822+chachinn@users.noreply.github.com"
          git add -A
          git commit -m "Add 60 reviewed Japanese and Filipino recipes"
          git push origin HEAD:bento-jp-ph-expansion-v25
