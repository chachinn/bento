name: Bento v23.2 final review QA

on:
  push:
    branches: [bento-chinese-v23]
    paths:
      - '.github/workflows/bento-v23-2-short-updates.yml'

permissions:
  contents: read

jobs:
  validate-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final review head
        uses: actions/checkout@v4
        with:
          ref: bento-v23-2-review
          fetch-depth: 0
      - name: Validate syntax and release markers
        run: |
          node --check app.js
          node --check service-worker.js
          node --check data/recipes-data.js
          grep -q "special:'genshin'" app.js
          grep -q "special:'anime'" app.js
          grep -q "data-game-collapse" app.js
          grep -q "mealRecipeSearchInput" index.html
          grep -q "groceryCheckAllButton" index.html
          grep -q "pantrySelectAllButton" index.html
          grep -q "data-recipe-serving" app.js
          grep -q "addRecipeIngredientsToGrocery(r,false,recipeDetailServingTarget)" app.js
          grep -q "bento-shell-v0.9.2-v23p3" service-worker.js
      - name: Validate full recipe library
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');global.window=global;const L=f=>vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          L('data/recipes-data.js');L('data/photo-index.js');L('data/korean-runtime.js');for(const f of fs.readdirSync('data').filter(x=>/^korean-recipes-\d+\.js$/.test(x)).sort())L('data/'+f);L('data/anime-runtime.js');for(const f of fs.readdirSync('data').filter(x=>/^anime-recipes-\d+\.js$/.test(x)).sort())L('data/'+f);L('data/chinese-init.js');for(let i=1;i<=40;i++)L(`data/chinese-recipes-${String(i).padStart(3,'0')}.js`);for(const f of ['chinese-runtime.js','chinese-meta-core.js','chinese-meta-extra.js','chinese-photo.js'])L('data/'+f);
          const all=window.BENTO_RECIPE_LIBRARY||[],ids=new Set(all.map(r=>r.id));if(all.length!==998||ids.size!==998)throw Error(`library mismatch ${all.length}/${ids.size}`);const est=all.find(r=>r.id==='fil_164_pork_estofado'),sou=all.find(r=>r.id==='jp_149_souffle_pancakes');if(!est||est.steps.length<8)throw Error('Pork Estofado missing/incomplete');if(!sou||sou.steps.length<8)throw Error('Souffle pancakes missing/incomplete');console.log('Final Bento v23.2 QA passed',all.length,ids.size);
          NODE
      - name: Confirm photo priority ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text()
          start=s.index('function recipePhotoPlan(r)')
          end=s.index('function ingredientPhotoPlan',start)
          chunk=s[start:end]
          assert chunk.index("special:'genshin'") < chunk.index('const plan=RECIPE_PHOTO_INDEX')
          assert chunk.index("special:'anime'") < chunk.index('const plan=RECIPE_PHOTO_INDEX')
          print('Source-world photo priority confirmed')
          PY
