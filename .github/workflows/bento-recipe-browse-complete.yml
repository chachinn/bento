name: Bento complete recipe browse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bento-recipe-browse-complete.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply complete browse fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          app_path = Path("app.js")
          style_path = Path("style.css")
          sw_path = Path("service-worker.js")
          index_path = Path("index.html")
          workflow_path = Path(".github/workflows/bento-recipe-browse-complete.yml")

          app = app_path.read_text(encoding="utf-8")

          start = app.index("      if(recipeBrowseMode==='desserts'){")
          end = app.index("      if(recipeBrowseMode==='drinks'){", start)
          app = app[:start] + '''      if(recipeBrowseMode==='desserts'){
                  const items=(DESSERT_STYLES||[]).filter(item=>recipeStyleCount('dessert',item.name.startsWith('All ')?'':item.name)>0);
                  const selected=items.some(item=>item.filter===recipeFilter)?recipeFilter:'Type:desserts';
                  panel.innerHTML=items.length?`<label class="compact-browse-select"><span class="browse-select-icon" aria-hidden="true">🍡</span><span class="sr-only">Choose dessert type</span><select class="dessert-browse-select" aria-label="Choose dessert type">${items.map(item=>{const styleName=item.name.startsWith('All ')?'':item.name,count=recipeStyleCount('dessert',styleName);return `<option value="${esc(item.filter)}" ${selected===item.filter?'selected':''}>${item.icon||'🍡'} ${esc(item.name)} · ${count}</option>`}).join('')}</select><span class="browse-select-chevron" aria-hidden="true">⌄</span></label>`:emptyCard('No dessert recipes yet.');
                  return;
                }
          ''' + app[end:]

          start = app.index("      if(recipeBrowseMode==='drinks'){")
          end = app.index("      if(recipeBrowseMode==='games'){", start)
          app = app[:start] + '''      if(recipeBrowseMode==='drinks'){
                  const items=(DRINK_STYLES||[]).filter(item=>recipeStyleCount('drink',item.name.startsWith('All ')?'':item.name)>0);
                  const selected=items.some(item=>item.filter===recipeFilter)?recipeFilter:'Type:drinks';
                  panel.innerHTML=items.length?`<label class="compact-browse-select"><span class="browse-select-icon" aria-hidden="true">🍵</span><span class="sr-only">Choose drink type</span><select class="drink-browse-select" aria-label="Choose drink type">${items.map(item=>{const styleName=item.name.startsWith('All ')?'':item.name,count=recipeStyleCount('drink',styleName);return `<option value="${esc(item.filter)}" ${selected===item.filter?'selected':''}>${item.icon||'🍵'} ${esc(item.name)} · ${count}</option>`}).join('')}</select><span class="browse-select-chevron" aria-hidden="true">⌄</span></label>`:emptyCard('No drink recipes yet.');
                  return;
                }
          ''' + app[end:]

          start = app.index("      if(recipeBrowseMode==='anime'){")
          end = app.index("    }catch", start)
          app = app[:start] + '''      if(recipeBrowseMode==='anime'){
                  const anime=rows.filter(r=>r.animeDish||r.animeSeries);
                  if(!anime.length){panel.innerHTML=emptyCard('No anime-inspired recipes yet.');return;}
                  const series=[...new Set(anime.map(r=>r.animeSeries).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
                  const selected=recipeFilter.startsWith('AnimeSeries:')?recipeFilter:'Anime';
                  panel.innerHTML=`<label class="compact-browse-select"><span class="browse-select-icon" aria-hidden="true">📺</span><span class="sr-only">Choose anime series</span><select class="anime-browse-select" aria-label="Choose anime series"><option value="Anime" ${selected==='Anime'?'selected':''}>All Anime · ${anime.length}</option>${series.map(name=>{const value=`AnimeSeries:${name}`,count=anime.filter(r=>r.animeSeries===name).length;return `<option value="${esc(value)}" ${selected===value?'selected':''}>📺 ${esc(name)} · ${count}</option>`}).join('')}</select><span class="browse-select-chevron" aria-hidden="true">⌄</span></label>`;
                  return;
                }
          ''' + app[end:]

          meal_handler = "    const mealSelect=e.target.closest('.meal-browse-select');if(mealSelect){recipeFilter=mealSelect.value||'Meals';recipeCuisineFilter='All';recipeRenderLimit=RECIPE_RENDER_BATCH;renderRecipes();return}"
          if meal_handler not in app:
              raise SystemExit("Meal dropdown handler not found")

          if "dessertSelect=e.target.closest('.dessert-browse-select')" not in app:
              app = app.replace(
                  meal_handler,
                  meal_handler
                  + "\n    const dessertSelect=e.target.closest('.dessert-browse-select');if(dessertSelect){recipeFilter=dessertSelect.value||'Type:desserts';recipeCuisineFilter='All';recipeRenderLimit=RECIPE_RENDER_BATCH;renderRecipes();return}"
                  + "\n    const drinkSelect=e.target.closest('.drink-browse-select');if(drinkSelect){recipeFilter=drinkSelect.value||'Type:drinks';recipeCuisineFilter='All';recipeRenderLimit=RECIPE_RENDER_BATCH;renderRecipes();return}"
                  + "\n    const animeSelect=e.target.closest('.anime-browse-select');if(animeSelect){recipeFilter=animeSelect.value||'Anime';recipeCuisineFilter='All';recipeRenderLimit=RECIPE_RENDER_BATCH;renderRecipes();return}",
                  1
              )

          app_path.write_text(app, encoding="utf-8")

          style = style_path.read_text(encoding="utf-8").rstrip()
          marker = "/* Complete compact Recipes browse */"
          if marker not in style:
              style += '''

          /* Complete compact Recipes browse */
          @media(max-width:520px){
            .recipe-library-view .recipe-browse-tabs{display:flex!important;overflow:hidden!important;width:100%!important}
            .recipe-library-view .recipe-browse-tabs button:not(.icon-only-browse){min-width:0!important;flex:1 1 0!important;padding:0 4px!important;font-size:9px!important}
            .recipe-library-view .recipe-browse-tabs .icon-only-browse{min-width:34px!important;width:34px!important;flex:0 0 34px!important;padding:0!important}
            .recipe-library-view .recipe-browse-tabs .icon-only-browse span{font-size:15px!important}
          }
          @media(max-width:370px){
            .recipe-library-view .recipe-browse-tabs{gap:3px!important;padding:3px!important}
            .recipe-library-view .recipe-browse-tabs button:not(.icon-only-browse){font-size:8.5px!important;padding:0 3px!important}
            .recipe-library-view .recipe-browse-tabs .icon-only-browse{min-width:31px!important;width:31px!important;flex-basis:31px!important}
          }
          '''
          style_path.write_text(style + "\n", encoding="utf-8")

          sw = sw_path.read_text(encoding="utf-8")
          sw, count = re.subn(
              r"const CACHE='bento-shell-v0\.7\.\d+-v21';",
              "const CACHE='bento-shell-v0.7.2-v21';",
              sw,
              count=1
          )
          if count != 1:
              raise SystemExit("Service worker cache line not found")
          sw_path.write_text(sw, encoding="utf-8")

          source = app_path.read_text(encoding="utf-8")
          index = index_path.read_text(encoding="utf-8")
          style_now = style_path.read_text(encoding="utf-8")

          checks = {
              "dessert dropdown": 'class="dessert-browse-select"' in source,
              "drink dropdown": 'class="drink-browse-select"' in source,
              "anime dropdown": 'class="anime-browse-select"' in source,
              "dessert handler": "dessertSelect=e.target.closest('.dessert-browse-select')" in source,
              "drink handler": "drinkSelect=e.target.closest('.drink-browse-select')" in source,
              "anime handler": "animeSelect=e.target.closest('.anime-browse-select')" in source,
              "anime series filter": "filter.startsWith('AnimeSeries:')" in source,
              "anime tab": 'data-recipe-browse="anime"' in index,
              "games tab": 'data-recipe-browse="games"' in index,
              "six tabs": index.count("data-recipe-browse=") >= 6,
              "mobile icon sizing": ".recipe-browse-tabs .icon-only-browse" in style_now,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Structural QA failed: " + ", ".join(failed))

          workflow_path.unlink()
          print("Complete Recipes browse QA passed.")
          PY

      - name: Validate JavaScript and structure
        run: |
          node --check app.js
          node --check service-worker.js
          test ! -f .github/workflows/bento-recipe-browse-complete.yml

      - name: Commit update
        run: |
          git config user.name "chachinn"
          git config user.email "140357822+chachinn@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Bento v21: complete compact browse and restore Anime [skip ci]"
          git push origin HEAD:main
