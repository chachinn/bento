name: Bento full recipe QA
on:
  push:
    branches: [bento-v24-full-recipe-qa]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check app.js
          node --check service-worker.js
          find data -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Full recipe audit
        run: node qa/full_recipe_audit.js
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-recipe-audit
          path: qa-out/full-recipe-audit.json
