name: Bento v31.2 Japanese release QA
on:
  push:
    branches: [bento-v31-2-japanese-depth]
  pull_request:
    branches: [main]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/qa-v31-2-japanese-release.mjs
