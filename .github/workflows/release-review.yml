name: Bento v24.1 clean release review
on:
  push:
    branches: [bento-v24-full-qa-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bento-v24-full-qa-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and manifest
        run: |
          node --check app.js
          node --check service-worker.js
          find data -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "JSON.parse(require('fs').readFileSync('data/library_manifest.json','utf8')); console.log('manifest JSON PASS')"
      - name: Export library
        run: node qa/export_full_library.js
      - name: Diagnostic audit
        continue-on-error: true
        run: node qa/full_recipe_audit.js
      - name: Final recipe gate
        run: node qa/final_recipe_gate.js
      - name: Source-world gate
        run: node qa/source_world_gate.js
      - name: Genshin source identity audit
        run: |
          npm install --no-save genshin-db@latest
          node qa/genshin_identity_audit.js
      - name: Production consistency
        run: |
          git diff --check
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(m=>m[1].split('?')[0]);
          for(const s of scripts)if(s.endsWith('.js')&&!fs.existsSync(s))throw new Error(`Missing index script ${s}`);
          const core=[...sw.matchAll(/'\.\/(.+?)'/g)].map(m=>m[1].split('?')[0]);
          for(const p of core)if(!fs.existsSync(p))throw new Error(`Missing cached asset ${p}`);
          const manifest=JSON.parse(fs.readFileSync('data/library_manifest.json','utf8'));
          if(manifest.appRelease!=='24.1'||manifest.instructionVersion!==28)throw new Error('Manifest release metadata mismatch');
          console.log('clean production consistency PASS');
          NODE
