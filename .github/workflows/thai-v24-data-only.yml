name: Thai v24 data-only correction
on:
  push:
    branches: [bento-thai-v24]
    paths: ['.github/workflows/thai-v24-data-only.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch staged data
        run: |
          python3 -c "from pathlib import Path; p=Path('data/thai-recipes-04.js'); s=p.read_text(); p.write_text(s.replace('35,10,45,4','35,0,35,4',1))"
          git config user.name 'chachinn'
          git config user.email '140357822+chachinn@users.noreply.github.com'
          git add data/thai-recipes-04.js
          git commit -m 'Bento v24: correct staged data'
          git push
