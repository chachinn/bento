name: Bento Chinese current-main audit

on:
  push:
    branches: [bento-cn-main-audit]
    paths: ['.github/workflows/chinese-main-audit.yml']

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chinese title inventory
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),path=require('path');
          global.window=global;global.BENTO_CN=[];
          for(const f of fs.readdirSync('data').filter(x=>/^chinese-recipes-\d+\.js$/.test(x)).sort())vm.runInThisContext(fs.readFileSync(path.join('data',f),'utf8'));
          for(const r of global.BENTO_CN) console.log(`${r[0]} | ${r[1]} | ${r[5]} | ${r[10]} | ${r[12].length} ingredients | ${r[13].length} steps`);
          NODE
