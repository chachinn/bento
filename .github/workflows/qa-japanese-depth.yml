name: Bento Japanese depth QA
on:
  push:
    branches: [bento-v31-2-japanese-depth]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Japanese depth full-library QA
        run: node scripts/qa-japanese-depth.mjs
      - name: Stage Japanese v31.2 integration
        run: node scripts/integrate-japanese-depth.mjs
      - name: Run Japanese v31.2 release regression
        run: node scripts/qa-japanese-depth-release.mjs
      - name: Commit integrated release files to branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- index.html service-worker.js data/library_manifest.json; then
            git config user.name 'chachinn'
            git config user.email '140357822+chachinn@users.noreply.github.com'
            git add index.html service-worker.js data/library_manifest.json
            git commit -m 'Integrate Japanese v31.2 regional depth'
            git push origin HEAD:bento-v31-2-japanese-depth
          fi
