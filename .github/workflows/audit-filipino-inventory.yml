name: Bento Filipino depth QA
on:
  push:
    branches: [bento-v31-3-filipino-depth]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Filipino module syntax
        run: |
          for f in data/filipino-extra-185-192.js data/filipino-extra-193-200.js data/filipino-extra-201-208.js data/filipino-extra-209-216.js data/filipino-extra-217-224.js data/filipino-extra-225-232.js data/filipino-extra-233-240.js data/filipino-extra-241-248.js; do node --check "$f"; done
      - name: Audit Filipino coverage
        run: node scripts/audit-filipino-coverage.mjs
      - name: Run Filipino depth QA
        run: node scripts/qa-filipino-depth.mjs
      - name: Run full-runtime Filipino QA
        run: node scripts/qa-filipino-runtime.mjs
