name: Bento Filipino inventory audit
on:
  push:
    branches: [bento-v31-3-filipino-depth]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-filipino-inventory.mjs
