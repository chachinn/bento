name: Bento full QA

on:
  push:
    branches: [bento-qa-aug13]
    paths:
      - '.github/workflows/bento-full-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe UI cleanup and run structural QA
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, json

          root=Path('.')
          index_path=root/'index.html'
          app_path=root/'app.js'
          style_path=root/'style.css'
          sw_path=root/'service-worker.js'
          workflow_path=root/'.github/workflows/bento-full-qa.yml'

          index=index_path.read_text(encoding='utf-8')
          app=app_path.read_text(encoding='utf-8')
          style=style_path.read_text(encoding='utf-8')
          sw=sw_path.read_text(encoding='utf-8')

          # Remove obsolete cuisine-picker styling that conflicts with the shared
          # compact-browse-select now used by Cuisines/Meals/Desserts/Drinks/Anime.
          style=style.replace('.cuisine-picker-card,.anime-library-intro,.anime-source-card{border-radius:16px}', '.anime-library-intro,.anime-source-card{border-radius:16px}')
          style=style.replace('.cuisine-picker-card~.browse-card-grid,.browse-card-grid[hidden]{display:none!important}', '.browse-card-grid[hidden]{display:none!important}')
          legacy_patterns=[
            r'\.cuisine-picker-card\{[^{}]*\}',
            r'\.cuisine-picker-head\{[^{}]*\}',
            r'\.cuisine-picker-head>span:last-child\{[^{}]*\}',
            r'\.cuisine-picker-head b\{[^{}]*\}',
            r'\.cuisine-picker-head small,\.cuisine-picker-note\{[^{}]*\}',
            r'\.cuisine-picker-icon\{[^{}]*\}',
            r'\.cuisine-select-wrap\{[^{}]*\}',
            r'\.cuisine-browse-select\{[^{}]*\}',
            r'\.cuisine-select-wrap>span\[aria-hidden=true\]\{[^{}]*\}',
            r'\.cuisine-picker-note\{[^{}]*\}',
            r'\.recipe-library-view \.cuisine-picker-card\{[^{}]*\}',
            r'\.recipe-library-view \.cuisine-picker-head,\.recipe-library-view \.cuisine-picker-note\{[^{}]*\}',
            r'\.recipe-library-view \.cuisine-select-wrap\{[^{}]*\}',
            r'\.recipe-library-view \.cuisine-browse-select\{[^{}]*\}',
            r'\.recipe-library-view \.cuisine-select-wrap>span\[aria-hidden=true\]\{[^{}]*\}',
          ]
          for pat in legacy_patterns:
            style=re.sub(pat,'',style)

          marker='/* QA unified compact browse control */'
          if marker not in style:
            style += '''\n\n/* QA unified compact browse control */\n.compact-browse-select{overflow:hidden}\n.compact-browse-select select{width:100%;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;margin:0!important}\n.compact-browse-select .browse-select-icon{display:grid;place-items:center;width:22px;height:22px;flex:0 0 22px}\n.compact-browse-select .browse-select-chevron{z-index:1}\n@media(max-width:520px){\n  .recipe-library-view .compact-browse-select{width:100%!important;min-height:36px!important;height:36px!important;padding:0 10px!important;border:1px solid var(--line)!important;border-radius:11px!important;background:var(--surface)!important;box-shadow:none!important}\n  .recipe-library-view .compact-browse-select select{height:34px!important;padding:0 26px 0 0!important;font-size:11.5px!important;font-weight:750!important;color:var(--text)!important}\n  .recipe-library-view .compact-browse-select .browse-select-icon{font-size:14px!important;width:20px!important;height:20px!important;flex-basis:20px!important}\n  .recipe-library-view .compact-browse-select .browse-select-chevron{right:10px!important;font-size:13px!important;color:var(--muted)!important}\n}\n'''

          mobile_marker='/* QA mobile layout safety */'
          if mobile_marker not in style:
            style += '''\n/* QA mobile layout safety */\n@media(max-width:520px){\n  .page-title-row,.subview-header,.section-heading{min-width:0}\n  .page-title-row>div,.subview-header>div,.section-heading>h2{min-width:0}\n  .action-row,.action-grid,.plan-toolbar,.chip-row{max-width:100%}\n  .search-row,.recipe-search-toolbar{min-width:0}\n  .search-row>*,.recipe-search-toolbar>*{min-width:0}\n  .settings-card,.info-card,.about-card,.summary-card,.meal-card,.list-card,.attention-card,.match-card,.smart-card,.plan-day{max-width:100%}\n  .bottom-nav button{min-width:0}\n}\n'''
          style_path.write_text(style.rstrip()+"\n",encoding='utf-8')

          sw2,n=re.subn(r"const CACHE='bento-shell-v0\.7\.\d+-v21';","const CACHE='bento-shell-v0.7.3-v21';",sw,count=1)
          if n==1:
            sw=sw2
            sw_path.write_text(sw,encoding='utf-8')

          class Parser(HTMLParser):
            def __init__(self):
              super().__init__(); self.ids=[]; self.views=[]; self.nav=[]; self.controls=[]; self.actions=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if a.get('id'): self.ids.append(a['id'])
              if a.get('data-view'): self.views.append(a['data-view'])
              if a.get('data-nav'): self.nav.append(a['data-nav'])
              if a.get('data-view-link'): self.nav.append(a['data-view-link'])
              if a.get('aria-controls'): self.controls.append(a['aria-controls'])
              if a.get('data-action'): self.actions.append(a['data-action'])

          p=Parser(); p.feed(index)
          ids=set(p.ids); views=set(p.views)
          errors=[]; warnings=[]

          dup_ids=sorted({x for x in p.ids if p.ids.count(x)>1})
          if dup_ids: errors.append('Duplicate HTML ids: '+', '.join(dup_ids))
          missing_nav=sorted(set(p.nav)-views)
          if missing_nav: errors.append('Navigation targets without views: '+', '.join(missing_nav))
          missing_controls=sorted(set(p.controls)-ids)
          if missing_controls: errors.append('aria-controls targets missing: '+', '.join(missing_controls))

          # JS references may target static HTML or controls dynamically rendered by app.js.
          js_ids=set(re.findall(r"\$\('#([A-Za-z0-9_-]+)'\)",app))
          js_ids |= set(re.findall(r"getElementById\(['\"]([A-Za-z0-9_-]+)['\"]\)",app))
          dynamic_ids=set(re.findall(r'id=[\\\"\']([A-Za-z0-9_-]+)[\\\"\']',app))
          unresolved_js_ids=sorted(js_ids-ids-dynamic_ids)
          if unresolved_js_ids: errors.append('JS references unresolved ids: '+', '.join(unresolved_js_ids[:40]))

          missing_actions=sorted({a for a in p.actions if a not in app})
          if missing_actions: errors.append('Static actions not wired in app.js: '+', '.join(missing_actions))

          for mode in ['cuisines','meals','desserts','drinks','games','anime']:
            if f'data-recipe-browse="{mode}"' not in index: errors.append(f'Missing browse tab: {mode}')
            if f"recipeBrowseMode==='{mode}'" not in app: errors.append(f'Missing browse renderer: {mode}')
          for cls in ['cuisine-browse-select','meal-browse-select','dessert-browse-select','drink-browse-select','anime-browse-select']:
            if cls not in app: errors.append('Missing browse dropdown/handler: '+cls)

          core_match=re.search(r'const CORE=\[(.*?)\];',sw,re.S)
          if not core_match: errors.append('Service worker CORE list missing')
          else:
            assets=re.findall(r"['\"]([^'\"]+)['\"]",core_match.group(1))
            for asset in assets:
              path=asset.split('?')[0].replace('./','')
              if path and not (root/path).exists(): errors.append('Missing cached asset: '+path)

          root_names={x.name for x in root.iterdir()}
          stale=[x for x in root_names if x.startswith('v20-') or x.startswith('v19-')]
          if stale: errors.append('Legacy sidecar files remain: '+', '.join(sorted(stale)))
          if 'That section could not refresh' in app: errors.append('Old false refresh toast remains in app.js')
          if 'upgradeApp' in sw or 'upgradeHtml' in sw: errors.append('Service worker still rewrites app source')

          final_style=style_path.read_text(encoding='utf-8')
          if final_style.count('{')!=final_style.count('}'):
            errors.append('CSS brace count mismatch')
          for dead in ['.cuisine-picker-card{','.cuisine-select-wrap{','.recipe-library-view .cuisine-browse-select{']:
            if dead in final_style: errors.append('Legacy cuisine CSS remains: '+dead)

          # Verify every declared view is referenced by navigation/render logic somewhere in app.js.
          for view in sorted(views):
            if view not in app:
              errors.append('View not referenced in app.js: '+view)

          # High-risk feature hooks that should exist after recent fixes.
          required_hooks=[
            'function renderCurrentView','function navigate(','function renderHome','function renderPlan','function renderRecipes',
            'function renderPantry','function renderGrocery','function renderSmart','function renderSettings','function renderCookingMode',
            "document.addEventListener('click'","document.addEventListener('change'",'recipeCardPhotos','AnimeSeries:',
            'data-genshin-region','data-game-series','data-clear-recipe-filters'
          ]
          for hook in required_hooks:
            if hook not in app: errors.append('Missing high-risk app hook: '+hook)

          print('BENTO FULL QA REPORT')
          print('Views:', ', '.join(sorted(views)))
          print('Static IDs:', len(ids), 'Dynamic IDs:', len(dynamic_ids), 'JS ID refs:', len(js_ids), 'Actions:', len(set(p.actions)))
          print('Errors:', len(errors))
          for e in errors: print('ERROR:',e)
          print('Warnings:', len(warnings))
          for w in warnings: print('WARN:',w)

          Path('qa-result.json').write_text(json.dumps({'errors':errors,'warnings':warnings},indent=2),encoding='utf-8')
          if not errors:
            workflow_path.unlink(missing_ok=True)
          PY

      - name: JavaScript syntax QA
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          for f in data/*.js; do node --check "$f"; done

      - name: Commit only if QA passes
        shell: bash
        run: |
          if grep -q '"errors": \[\]' qa-result.json; then
            rm -f qa-result.json
            git config user.name 'chachinn'
            git config user.email '140357822+chachinn@users.noreply.github.com'
            git add style.css service-worker.js .github/workflows/bento-full-qa.yml
            git diff --cached --check
            git commit -m 'Bento v21.1: full QA hardening and unified browse UI'
            git push origin HEAD:bento-qa-aug13
          else
            echo 'QA_BLOCKED: no app changes committed.'
            cat qa-result.json
          fi
