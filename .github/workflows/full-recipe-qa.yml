name: Bento full recipe QA
on:
  push:
    branches: [bento-v24-full-recipe-qa]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-system-fixes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bento-v24-full-recipe-qa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply idempotent production fixes
        run: node qa/apply_system_fixes.js
      - name: Commit generated fixes when needed
        run: |
          if git diff --quiet; then
            echo "No generated fix changes"
            exit 0
          fi
          git config user.name "chachinn"
          git config user.email "140357822+chachinn@users.noreply.github.com"
          git add app.js index.html service-worker.js
          git commit -m "Apply Bento recipe QA system fixes"
          git push origin HEAD:bento-v24-full-recipe-qa
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check app.js
          node --check service-worker.js
          find data -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Export full library
        run: node qa/export_full_library.js
      - name: Full recipe audit
        run: node qa/full_recipe_audit.js
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-recipe-audit
          path: qa-out/*.json
